const cleanData=d=>JSON.parse(JSON.stringify(d)); // Firestore não aceita undefined
function FireDB(fs){
  function docRef(p){const r=fs.doc(p);return {id:r.id,path:p,
    get:()=>r.get(),set:d=>r.set(cleanData(d)),update:d=>r.update(cleanData(d)),delete:()=>r.delete(),
    onSnapshot:(n,e)=>r.onSnapshot(n,e||(x=>console.warn(p,x))),collection:c=>colRef(p+"/"+c)}}
  function q(ref,p){return {where:(a,b,c)=>q(ref.where(a,b,c),p),orderBy:(a,b)=>q(ref.orderBy(a,b||"asc"),p),limit:n=>q(ref.limit(n),p),
    get:()=>ref.get(),onSnapshot:(n,e)=>ref.onSnapshot(n,e||(x=>console.warn(p,x)))}}
  function colRef(p){const c=fs.collection(p);return Object.assign(q(c,p),{path:p,doc:id=>docRef(p+"/"+(id||c.doc().id)),add:async d=>{const r=await c.add(cleanData(d));return docRef(p+"/"+r.id)}})}
  return {doc:docRef,collection:colRef};
}

const Auth={
  _pending:"", _cbs:[],
  async register(email,pass,name){
    Auth._pending=name;
    if(Store.mode==="cloud"){
      const c=await Store.auth.createUserWithEmailAndPassword(email,pass);
      try{await c.user.updateProfile({displayName:name})}catch(e){}
      await Store.fs.doc("users/"+c.user.uid).set({name,email,createdAt:Date.now()});
      return;
    }
    const k="localauth/"+email.toLowerCase().replace(/[^a-z0-9_.\-]/g,"_");
    if(await DB.get(k))throw {code:"auth/email-already-in-use"};
    const id=uid(),salt=uid();
    await DB.set(k,{uid:id,salt,hash:await sha256(salt+":"+pass),name,email,createdAt:Date.now()});
    await DB.set("users/"+id,{name,email,createdAt:Date.now()});
    lsSet("itm_local_uid",JSON.stringify({uid:id,email,displayName:name})); Auth._emit();
  },
  async login(email,pass){
    if(Store.mode==="cloud")return Store.auth.signInWithEmailAndPassword(email,pass);
    const a=await DB.get("localauth/"+email.toLowerCase().replace(/[^a-z0-9_.\-]/g,"_"));
    if(!a||await sha256(a.salt+":"+pass)!==a.hash)throw {code:"auth/invalid-credential"};
    lsSet("itm_local_uid",JSON.stringify({uid:a.uid,email:a.email,displayName:a.name})); Auth._emit();
  },
  logout(){ if(Store.mode==="cloud")return Store.auth.signOut(); lsSet("itm_local_uid",null); Auth._emit() },
  reset(email){ if(Store.mode==="cloud")return Store.auth.sendPasswordResetEmail(email); return Promise.reject({code:"local"}) },
  _emit(){ let u=null;try{u=JSON.parse(lsGet("itm_local_uid")||"null")}catch(e){} Auth._cbs.forEach(cb=>cb(u)) },
  onChange(cb){ if(Store.mode==="cloud")return Store.auth.onAuthStateChanged(cb); Auth._cbs.push(cb); Auth._emit() }
};

const chains={};
function handleWriteErr(e){
  console.error(e);
  const code=e&&e.code;
  if(code==="permission-denied")toast("Você não tem permissão para fazer isso nesta campanha.");
  else if(code==="unavailable")toast("Sem conexão com o servidor. A alteração será enviada quando a internet voltar.");
  else if(code==="resource-exhausted"||code==="resource_exhausted")toast("Muitas ações seguidas. Espere alguns segundos e tente de novo.");
  else if(code==="invalid-argument"&&/longer than|exceeds/i.test(e.message||""))toast("A imagem ou o texto ficou grande demais para salvar.");
  else toast("Erro ao salvar: "+((e&&e.message)||"tente novamente"));
}
function enqueue(path,job){
  chains[path]=(chains[path]||Promise.resolve()).then(job).catch(e=>{handleWriteErr(e);throw e});
  const p=chains[path];chains[path]=p.catch(()=>{});return p;
}
const DB={
  async get(p){const s=await Store.db.doc(p).get();return s.exists?s.data():null},
  set(p,d){return enqueue(p,()=>Store.db.doc(p).set(d))},
  update(p,d){return enqueue(p,()=>Store.db.doc(p).update(d))},
  del(p){return enqueue(p,()=>Store.db.doc(p).delete())},
  async list(p,fn){let q=Store.db.collection(p);if(fn)q=fn(q);const s=await q.get();return s.docs.map(d=>Object.assign({id:d.id},d.data()))},
  async claim(p,data){ // cria somente se não existir
    if(Store.mode==="cloud"){
      const ref=Store.fs.doc(p);
      return Store.fs.runTransaction(async tx=>{const s=await tx.get(ref);if(s.exists)return false;tx.set(ref,cleanData(data));return true});
    }
    const s=await Store.db.doc(p).get();if(s.exists)return false;
    await DB.set(p,data);return true;
  }
};

  const email=$("#lg-email").value.trim(), p=$("#lg-pass").value;
  S.loginEmail=email; S.loginErr=""; S.loginOk="";
  let name="";
  if(reg){
    name=$("#lg-name").value.trim(); S.loginName=name;
    if(name.length<2){S.loginErr="Escolha um nome de exibição com pelo menos 2 letras.";return render()}
    if(p!==$("#lg-pass2").value){S.loginErr="As senhas não conferem.";return render()}
  }
  if(p.length<6){S.loginErr="A senha precisa de pelo menos 6 caracteres.";return render()}
  S.loginBusy=true; render();
  try{ if(reg) await Auth.register(email,p,name); else await Auth.login(email,p) }
  catch(e){ S.loginErr=authMsg(e) }
  S.loginBusy=false; if(!S.user)render();
}
async function forgotPassword(){
  const el=$("#lg-email"); const email=(el&&el.value.trim())||"";
  S.loginEmail=email; S.loginErr=""; S.loginOk="";
  if(!email){S.loginErr="Digite seu e-mail acima e clique de novo em “Esqueci minha senha”.";return render()}
  try{await Auth.reset(email);S.loginOk="Enviamos um link para redefinir a senha. Confira seu e-mail (e a caixa de spam)."}
  catch(e){S.loginErr=e&&e.code==="local"?"No modo local não há envio de e-mail.":authMsg(e)}
  render();
}
function logout(){lsSet("itm_lastcamp",null);Auth.logout()}
async function onAuthUser(u){
  if(!u){unsub("home");if(S.code)leaveCamp(true);closeSheet(true);S.user=null;S.view="login";S.camps=[];S.campCache={};S.coverCache={};S.booting=false;S.loginBusy=false;render();return}
  let name=u.displayName||Auth._pending||"";
  if(!name){const prof=await DB.get("users/"+u.uid).catch(()=>null);name=(prof&&prof.name)||(u.email||"").split("@")[0]}
  Auth._pending="";
  S.user={username:name,key:u.uid,email:u.email}; S.view="home"; S.booting=false; S.loginBusy=false; S.loginErr="";S.loginOk="";S.loginMode="login";
  startHome();
  const lc=lsGet("itm_lastcamp");
  if(lc){const m=await DB.get(`users/${u.uid}/camps/${lc}`).catch(()=>null);if(m){enterCamp(lc);return}lsSet("itm_lastcamp",null)}
  render();
}

/* ---------------------------- HOME ---------------------------- */
function startHome(){
  unsub("home");
  subs.home.push(Store.db.collection(`users/${S.user.key}/camps`).onSnapshot(async snap=>{
    S.camps=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    render();
    for(const c of S.camps){ if(!(c.code in S.campCache)) loadCampMeta(c.code) }
  },e=>console.warn(e)));
}
async function loadCampMeta(code){
  S.campCache[code]=S.campCache[code]||null;
  try{
    const c=await DB.get("campaigns/"+code);
    if(!c||!c.code){ S.campCache[code]={gone:true}; render(); return }
    S.campCache[code]=c; render();
    const cv=await DB.get("covers/"+code); S.coverCache[code]=cv?cv.img:""; render();
  }catch(e){console.warn(e)}
}

function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=A[rnd(A.length)-1];return s}
async function createCamp(){
  const name=$("#cr-name").value.trim(), desc=$("#cr-desc").value.trim();
  if(!name)return;
  try{
    let code=null;
    for(let i=0;i<8&&!code;i++){const c=genCode();if(await DB.claim("campaigns/"+c,{code:c,name,desc,master:S.user.key,masterName:S.user.username,createdAt:Date.now()}))code=c}
    if(!code){toast("Não foi possível gerar um código. Tente de novo.");return}
    await DB.set(`campaigns/${code}/members/${S.user.key}`,{user:S.user.key,name:S.user.username,role:"master",joinedAt:Date.now()});
    await DB.set(`users/${S.user.key}/camps/${code}`,{code,role:"master",name,joinedAt:Date.now()});
    closeModal(); toast("Campanha criada. Código: "+code,true); enterCamp(code);
  }catch(e){}
}
function openJoin(){
  S.modal="join";
  openModal(`<div class="mh"><h2>Entrar em Campanha</h2><button class="icon-btn" data-act="modal-cancel" aria-label="Fechar">${ICON.close}</button></div>
  <form id="join-form"><div class="mb">
    <label class="field"><span class="label">Código da campanha</span><input class="inp code" id="jn-code" required maxlength="6" placeholder="XXXXXX" autofocus></label>
    <p id="jn-err" class="pen" hidden></p>
  </div><div class="mf"><button type="button" class="btn ghost" data-act="modal-cancel">Cancelar</button><button class="btn primary" type="submit">Entrar</button></div></form>`);
}
async function joinCamp(){
  const code=$("#jn-code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  const err=m=>{const e=$("#jn-err");e.textContent=m;e.hidden=false};
  if(code.length!==6)return err("O código tem 6 caracteres.");
  try{
    const c=await DB.get("campaigns/"+code);
    if(!c||!c.code)return err("Nenhuma campanha com esse código. Confira com o mestre.");
    const role=c.master===S.user.key?"master":"player";
    await DB.set(`campaigns/${code}/members/${S.user.key}`,{user:S.user.key,name:S.user.username,role,joinedAt:Date.now()});
    await DB.set(`users/${S.user.key}/camps/${code}`,{code,role,name:c.name,joinedAt:Date.now()});
    closeModal(); toast("Você entrou em "+c.name,true); enterCamp(code);
  }catch(e){}
}
async function leaveCampaign(code){
  if(!await askConfirm("Sair da campanha?","Você deixará de ver esta campanha em “Minhas Campanhas”. Suas fichas continuam com o mestre.","Sair"))return;
  closeModal();
  await DB.del(`campaigns/${code}/members/${S.user.key}`).catch(()=>{});
  await DB.del(`users/${S.user.key}/camps/${code}`).catch(()=>{});
  if(S.code===code)leaveCamp();
  toast("Você saiu da campanha.",true);
}
async function deleteCampaign(code){
  const meta=S.campCache[code]||S.camp||{};
  if(!await askConfirm("Deletar campanha?",`Isso apaga <b>${esc(meta.name||code)}</b> para todos: fichas, NPCs, rolagens, recompensas e capa. Não dá para desfazer.`,"Deletar para sempre"))return;
  closeModal();
  try{
    toast("Apagando campanha…",true);
    if(S.code===code)leaveCamp();
    const members=await DB.list(`campaigns/${code}/members`);
    await DB.del(`campaigns/${code}/gm/state`).catch(()=>{});
    for(const col of ["sheets","npcs","rolls","rewards","members"]){
      const docs=await DB.list(`campaigns/${code}/${col}`);
      for(const d of docs) await DB.del(`campaigns/${code}/${col}/${d.id}`);
    }
    for(const m of members) await DB.del(`users/${m.id}/camps/${code}`).catch(()=>{});
    await DB.del(`users/${S.user.key}/camps/${code}`).catch(()=>{});
    await DB.del("covers/"+code); await DB.del("campaigns/"+code);
    delete S.campCache[code]; toast("Campanha deletada.",true);
  }catch(e){}
}

/* ---------------------------- CAMPANHA ---------------------------- */
function enterCamp(code){
  unsub("camp"); S.code=code; S.camp=null; S.view="camp"; S.tab=null;
  S.members=[];S.sheets=[];S.npcs=[];S.rolls=[];S.rewards=[];S.cover=null;S.balSeen=0;S.rew={sel:{},amt:{},def:1,reason:"",q:[false,false,false]};
  lsSet("itm_lastcamp",code);
  const base="campaigns/"+code;
  subs.camp.push(Store.db.doc(base).onSnapshot(s=>{
    if(!s.exists){ if(S.code===code){toast("Esta campanha não existe mais.");leaveCamp()} return }
    const first=!S.camp; S.camp=s.data();
    if(first){ S.tab=isMaster()?"master":"players"; startCampSubs(code) }
    render();
  },e=>console.warn(e)));
  subs.camp.push(Store.db.doc("covers/"+code).onSnapshot(s=>{S.cover=s.exists?s.data().img:"";S.coverCache[code]=S.cover;render()}));
  render();
}
function startCampSubs(code){
  const base="campaigns/"+code;
  subs.camp.push(Store.db.collection(base+"/rolls").orderBy("ts","desc").limit(60).onSnapshot(s=>{
    const list=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    const prevTop=S.rolls[0]&&S.rolls[0].id; S.rolls=list;
    if(!S.balSeen) S.balSeen=list.length?list[0].ts:Date.now();
    if(S.balOpen) S.balSeen=list.length?list[0].ts:S.balSeen;
    keepFocus(()=>renderBalloon(prevTop));
  },e=>console.warn(e)));
  subs.camp.push(Store.db.collection(base+"/members").onSnapshot(s=>{S.members=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()}));
  subs.camp.push(Store.db.collection(base+"/sheets").onSnapshot(s=>{S.sheets=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));render()}));
  if(isMaster()){
    subs.camp.push(Store.db.collection(base+"/npcs").onSnapshot(s=>{S.npcs=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));render()}));
    subs.camp.push(Store.db.doc(base+"/gm/state").onSnapshot(s=>{const d=s.exists?s.data():{hold:{},notes:""};if(!d.hold)d.hold={};if(document.activeElement&&document.activeElement.id==="gm-notes")d.notes=S.gm.notes;S.gm=d;render()},e=>console.warn(e)));
    subs.camp.push(Store.db.collection(base+"/rewards").orderBy("ts","desc").limit(50).onSnapshot(s=>{S.rewards=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()}));
  }
}

async function doRoll(o){
  const n=Math.max(1,Math.min(100,o.n||2)), sides=Math.max(2,Math.min(1000,o.sides||10));
  const dice=[];for(let i=0;i<n;i++)dice.push(rnd(sides));
  const modTotal=(o.mods||[]).reduce((a,m)=>a+m.v,0);
  const total=dice.reduce((a,b)=>a+b,0)+modTotal;
  const tier=o.tiered?(total>=15?"full":total>=10?"partial":"fail"):null;
  const rec={ts:Date.now(),user:S.user.key,userName:S.user.username,char:o.char||"",label:o.label||`${n}d${sides}`,n,sides,dice,mods:(o.mods||[]).filter(m=>m.v!==0),total,tier,secret:!!o.secret};
  showResult(rec,o.outcomes,o.actions);
  if(!S.code)return;
  const id=uid(); S.lastRollId=id;
  try{ await DB.set(`campaigns/${S.code}/rolls/${id}`,rec) }catch(e){}
  if(isMaster()&&Math.random()<0.12) pruneRolls();
}
async function pruneRolls(){
  try{const all=await DB.list(`campaigns/${S.code}/rolls`,q=>q.orderBy("ts","desc").limit(400));
    for(const d of all.slice(150)) await DB.del(`campaigns/${S.code}/rolls/${d.id}`);}catch(e){}
}

function normalizePC(s){const b=blankPC();for(const k in b){if(s[k]==null)s[k]=b[k]}
  s.attrs=Object.assign(b.attrs,s.attrs||{});s.look=Object.assign(b.look,s.look||{});
  s.wounds=s.wounds||b.wounds; s.wounds.serious=(s.wounds.serious||[]).concat(b.wounds.serious).slice(0,4); s.wounds.critical=s.wounds.critical||b.wounds.critical;
  while(s.hooks.length<2)s.hooks.push({t:"",done:false}); return s}

/* ---------------------------- FICHA: abrir/salvar ---------------------------- */
function openSheet(kind,id){
  unsub("sheet"); S.sheet={kind,id}; S.sheetData=null; S.sheetDirty=false; S.sitMod=0;
  const p=`campaigns/${S.code}/${kind==="pc"?"sheets":"npcs"}/${id}`;
  const w=$("#sheetwrap"); w.hidden=false; w.scrollTop=0; w.innerHTML=`<div class="sheet"><p class="muted">Carregando ficha…</p></div>`;
  document.body.style.overflow="hidden";
  subs.sheet.push(Store.db.doc(p).onSnapshot(s=>{
    if(!s.exists){toast("Esta ficha foi apagada.");closeSheet();return}
    if(S.sheetDirty||s.metadata.hasPendingWrites)return;
    const d=s.data(); S.sheetData=kind==="pc"?normalizePC(d):Object.assign(blankNPC(),d);
    renderSheet();
  },e=>console.warn(e)));
}
function closeSheet(silent){
  if(S.sheetDirty)flushSheet();
  unsub("sheet"); S.sheet=null; S.sheetData=null; const w=$("#sheetwrap"); w.hidden=true; w.innerHTML=""; document.body.style.overflow="";
  if(!silent)render();
}
let saveT=null, editSeq=0;
function touchSheet(rerender){
  S.sheetDirty=true; editSeq++; clearTimeout(saveT); saveT=setTimeout(flushSheet,550);
  if(rerender)renderSheet();
}
function flushSheet(){
  clearTimeout(saveT); if(!S.sheet||!S.sheetData)return;
  const p=`campaigns/${S.code}/${S.sheet.kind==="pc"?"sheets":"npcs"}/${S.sheet.id}`;
  const d=clone(S.sheetData); d.updatedAt=Date.now(); const seq=editSeq;
  const done=()=>{if(seq===editSeq){S.sheetDirty=false;const b=document.querySelector("#sheetwrap .sv");if(b)b.textContent="salvo"}};
  DB.set(p,d).then(done,done);
}
function renderSheet(){
  if(!S.sheet||!S.sheetData)return;
  const w=$("#sheetwrap"); const top=w.scrollTop;
  const open=new Set([...w.querySelectorAll("details[open][data-dk]")].map(d=>d.dataset.dk));
  keepFocus(()=>{ w.innerHTML=S.sheet.kind==="pc"?viewPC(S.sheetData):viewNPC(S.sheetData) });
  w.querySelectorAll("details[data-dk]").forEach(d=>{if(open.has(d.dataset.dk))d.open=true});
  w.scrollTop=top;
}

function listSection(title,key,arr,item,adder,foot){

    <div class="items">${arr.map(item).join("")||`<p class="muted small">Nada ainda.</p>`}</div>${adder||""}${foot||""}</section>`;
}

/* ---- Rolagens a partir da ficha ---- */
function baseMods(s,extra){
  const m=[]; const wp=woundPenalty(s); if(wp)m.push({l:"Ferimentos",v:wp});
  if(S.sitMod)m.push({l:"Situacional",v:S.sitMod}); return m.concat(extra||[]);
}
function rollFromSheet(label,attrKey,extraMods,outcomes,actions){
  const s=S.sheetData; const mods=[];
  if(attrKey)mods.push({l:ATTR_LABEL[attrKey],v:s.attrs[attrKey]||0});
  doRoll({n:2,sides:10,label,char:s.name||"Sem nome",mods:baseMods(s,mods.concat(extraMods||[])),tiered:true,outcomes,actions,secret:false});
  if(S.sitMod){S.sitMod=0;renderSheet()}
}
function rollMove(id){
  const m=MOVES.find(x=>x.id===id), s=S.sheetData, sm=stabMods(s.stability);
  if(m.id==="suportar")return openDamage();
  if(m.id==="ajudar")return openHelp();
  const extra=[];
  if(m.id==="controle"&&sm.controle)extra.push({l:"Estabilidade",v:sm.controle});
  if(m.id==="ilusao"&&sm.ilusao)extra.push({l:"Estabilidade",v:sm.ilusao});
  rollFromSheet(m.name,m.attr,extra,m.o,m.id==="controle"?controlActions(S.sheet.id):null);
}
function openDamage(){
  const s=S.sheetData;
  openModal(`<div class="mh"><h2>Suportar Lesão</h2><button class="icon-btn" data-act="modal-cancel" aria-label="Fechar">${ICON.close}</button></div>
   <div class="mb"><p>Role <b>+Fortitude −Dano</b>${s.armor?`, + Armadura (${sgnN(+s.armor)})`:""}${hasAdv(s,"Durão")?", +1 Durão":""}.</p>
   <label class="field"><span class="label">Dano do ataque</span><input class="inp num" id="dmg" type="number" min="0" max="10" value="2" autofocus></label>
   <div class="dpreset">${[0,1,2,3,4].map(v=>`<button class="btn xs" data-act="dmg-set" data-v="${v}">[${v}]</button>`).join("")}</div></div>
   <div class="mf"><button class="btn ghost" data-act="modal-cancel">Cancelar</button><button class="btn primary" data-act="dmg-roll">Rolar</button></div>`);
}
function openHelp(){
  openModal(`<div class="mh"><h2>Ajudar ou Atrapalhar</h2><button class="icon-btn" data-act="modal-cancel" aria-label="Fechar">${ICON.close}</button></div>
   <div class="mb"><p>Role o mesmo atributo que o outro personagem vai rolar.</p>
   <label class="field"><span class="label">Atributo</span><select id="help-attr">${[...PASSIVE,...ACTIVE].map(k=>`<option value="${k}">${ATTR_LABEL[k]} ${sgnN(S.sheetData.attrs[k]||0)}</option>`).join("")}</select></label>
   <label class="row"><input type="radio" name="hh" value="Ajudar" checked> Ajudar</label><label class="row"><input type="radio" name="hh" value="Atrapalhar"> Atrapalhar</label></div>
   <div class="mf"><button class="btn ghost" data-act="modal-cancel">Cancelar</button><button class="btn primary" data-act="help-roll">Rolar</button></div>`);
}

/* ---- Texto do livro ---- */
function bookHTML(name){
  const f=FULL[name]; if(!f)return "";
  return `<details class="book" data-dk="b:${esc(name)}"><summary>Texto do livro</summary><p>${esc(f.t)}</p>${f.o?`<p><b class="tier-full">15+</b> ${esc(f.o[0])}\n<b class="tier-partial">10–14</b> ${esc(f.o[1])}\n<b class="tier-fail">−9</b> ${esc(f.o[2])}</p>`:""}${f.x?`<p>${esc(f.x)}</p>`:""}</details>`;
}
function canRollTrait(name){const f=FULL[name];return !f||!!f.o}
function edgeActions(sid,i,name){
  const f=FULL[name]; if(!f||!f.o)return null;
  return tier=>{const txt=f.o[tier==="full"?0:tier==="partial"?1:2];const m=txt.match(/Receba (\d+) Trunfos?/i);
    return m?[{l:`Receber ${m[1]} Trunfo${m[1]>1?"s":""}`,f:()=>applyToSheet(sid,s=>{const a=s.advantages[i];if(a){a.edges=+m[1];return `${a.name}: ${m[1]} Trunfo(s).`}})}]:[]};
}

/* ---- Aplicar consequências na ficha ---- */
function applyToSheet(sid,fn){
  if(!S.sheet||S.sheet.id!==sid||!S.sheetData)return toast("Abra a ficha para aplicar.");
  const msg=fn(S.sheetData); touchSheet(true); if(msg)toast(msg,true);
}
function loseStab(s,n){
  const ina=hasAdv(s,"Inabalável"); if(ina)n=Math.max(0,n-1);
  const b=s.stability; s.stability=Math.max(1,s.stability-n);
  return `Estabilidade: ${STAB[b]} → ${STAB[s.stability]}${ina?" (Inabalável: −1 nível a menos)":""}.`;
}
function addCond(s,c){if(!s.conditions.includes(c))s.conditions.push(c)}
function addCritical(s){const c=s.wounds.critical;if(c.on&&!c.s)return "Já existe um Ferimento Crítico: escolha entre nocaute ou morte.";s.wounds.critical={on:true,t:c.t||"",s:false};return "Ferimento Crítico marcado. Descreva-o na ficha."}
function addSerious(s){const w=s.wounds.serious.find(x=>!x.on);if(w){w.on=true;w.s=false;return "Ferimento Grave marcado. Descreva-o na ficha."}return "Quatro Ferimentos Graves: este conta como Crítico. "+addCritical(s)}
function injuryActions(sid){return tier=>tier==="partial"?[
    {l:"Ferimento Grave",f:()=>applyToSheet(sid,addSerious)},
    {l:"Desnorteada",f:()=>applyToSheet(sid,s=>{addCond(s,"Desnorteada");return "Condição: Desnorteada."})},
  ]:tier==="fail"?[
    {l:"Nocauteada",f:()=>applyToSheet(sid,s=>{addCond(s,"Nocauteada");return "Nocauteada. A MJ pode impor um Ferimento Grave."})},
    {l:"Ferimento Crítico",f:()=>applyToSheet(sid,addCritical)},
  ]:[]}
function controlActions(sid){return tier=>tier==="partial"?[
    ...["Irritada","Triste","Assustada","Culpada"].map(c=>({l:c+" (−1 Est.)",f:()=>applyToSheet(sid,s=>{addCond(s,c);return "Condição: "+c+". "+loseStab(s,1)})})),
    ...["Obcecada","Distraída","Assombrada"].map(c=>({l:c,f:()=>applyToSheet(sid,s=>{addCond(s,c);return "Condição: "+c+"."})})),
  ]:tier==="fail"?[
    {l:"Trauma (−2 Est.)",f:()=>applyToSheet(sid,s=>loseStab(s,2))},
    {l:"Trauma que muda a vida (−4 Est.)",f:()=>applyToSheet(sid,s=>loseStab(s,4))},
  ]:[]}
function moveMod(s,id){
  const m=MOVES.find(x=>x.id===id); if(!m||m.attr==="*")return null;
  const sm=stabMods(s.stability); let v=(s.attrs[m.attr]||0)+woundPenalty(s);
  if(id==="controle")v+=sm.controle; if(id==="ilusao")v+=sm.ilusao;
  if(id==="suportar"){v+=(+s.armor||0)+(hasAdv(s,"Durão")?1:0)}
  return v;
}

      <optgroup label="Qualquer Arquétipo" id="adv-any-group">${Object.keys(ADV).filter(x=>!owned.has(x)).map(x=>`<option>${esc(x)}</option>`).join("")}</optgroup></select></label>
    <label class="field" id="adv-note-f" hidden><span class="label">Anotação</span><input class="inp" id="adv-note" maxlength="140" placeholder="Descreva a mudança combinada com a MJ"></label>
    <p id="adv-err" class="pen" hidden></p>
   </div><div class="mf"><button class="btn ghost" data-act="modal-cancel">Cancelar</button><button class="btn primary" data-act="adv-apply">Aplicar progressão</button></div>`,"");

function syncAdvanceUI(){
  const v=(document.querySelector('input[name=advopt]:checked')||{}).value;
  document.querySelectorAll(".modal .opt").forEach(o=>o.classList.toggle("on",o.querySelector("input").checked));
  $("#adv-attr-f").hidden=!["act3","pas3","any4","any4b"].includes(v);
  $("#adv-adv-f").hidden=!["advA","advAny"].includes(v);
  $("#adv-note-f").hidden=!["arch","end","illum"].includes(v);
  if(v==="act3"||v==="pas3"){ const list=v==="act3"?ACTIVE:PASSIVE; [...$("#adv-attr").options].forEach(o=>o.hidden=!list.includes(o.value)); if($("#adv-attr").selectedOptions[0].hidden)$("#adv-attr").value=list[0] }
  else [...$("#adv-attr").options].forEach(o=>o.hidden=false);
}
function applyAdvance(){
  const s=S.sheetData, v=(document.querySelector('input[name=advopt]:checked')||{}).value, err=m=>{$("#adv-err").textContent=m;$("#adv-err").hidden=false};
  if((s.xp||0)<5)return err("É preciso ter 5 de Experiência.");
  let text="";
  if(["act3","pas3","any4","any4b"].includes(v)){
    const k=$("#adv-attr").value, cap=(v==="act3"||v==="pas3")?3:4, cur=s.attrs[k]||0;
    if(v==="act3"&&!ACTIVE.includes(k))return err("Escolha um atributo ativo.");
    if(v==="pas3"&&!PASSIVE.includes(k))return err("Escolha um atributo passivo.");
    if(cur+1>cap)return err(`${ATTR_LABEL[k]} não pode passar de +${cap} com essa progressão.`);
    s.attrs[k]=cur+1; text=`${ATTR_LABEL[k]} ${sgnN(cur)} → ${sgnN(cur+1)}`;
  }else if(v==="advA"||v==="advAny"){
    const name=$("#adv-adv").value; if(!name)return err("Escolha uma vantagem.");
    const arch=ARCH_BY[s.archetype];
    if(v==="advA"&&arch&&!arch.adv.includes(name))return err("Essa vantagem não é do seu arquétipo. Use a opção de qualquer arquétipo (após 5 progressões).");
    s.advantages.push({name,attr:(ADV[name]||[""])[0],notes:""}); text="Nova vantagem: "+name;
  }else{
    const lab={arch:"Troca de Arquétipo",end:"Arco encerrado (novo personagem com 2 progressões)",illum:"Progressão para Arquétipo Iluminado"}[v];
    text=lab+(($("#adv-note").value||"").trim()?": "+$("#adv-note").value.trim():"");
  }
  s.xp-=5; s.advancements.push({ts:Date.now(),text});
  closeModal(); toast("Progressão aplicada: "+text,true); touchSheet(true);
}

/* ---------------------------- RECOMPENSAS ---------------------------- */
async function giveReward(){
  const r=S.rew; const entries=S.sheets.filter(s=>r.sel[s.id]).map(s=>({id:s.id,name:s.name||"Sem nome",amount:parseInt(r.amt[s.id]!=null?r.amt[s.id]:r.def,10)||0})).filter(e=>e.amount!==0);
  if(!entries.length)return toast("Marque ao menos uma ficha com XP diferente de zero.");
  try{
    for(const e of entries){
      const p=`campaigns/${S.code}/sheets/${e.id}`; const cur=await DB.get(p); if(!cur)continue;
      cur.xp=Math.max(0,(cur.xp||0)+e.amount); cur.xpTotal=Math.max(0,(cur.xpTotal||0)+e.amount); cur.updatedAt=Date.now();
      await DB.set(p,cur);
    }
    await DB.set(`campaigns/${S.code}/rewards/${uid()}`,{ts:Date.now(),by:S.user.key,reason:r.reason,entries,reverted:false});
    S.rew={sel:{},amt:{},def:1,reason:"",q:[false,false,false]}; toast("Recompensa concedida.",true); render();
  }catch(e){}
}
async function revertReward(id){
  const h=S.rewards.find(x=>x.id===id); if(!h||h.reverted)return;
  if(!await askConfirm("Reverter recompensa?","A experiência concedida será retirada das fichas desta recompensa. Progressões já feitas não são desfeitas.","Reverter"))return;
  closeModal();
  try{
    for(const e of h.entries){const p=`campaigns/${S.code}/sheets/${e.id}`;const cur=await DB.get(p);if(!cur)continue;
      cur.xp=Math.max(0,(cur.xp||0)-e.amount);cur.xpTotal=Math.max(0,(cur.xpTotal||0)-e.amount);cur.updatedAt=Date.now();await DB.set(p,cur)}
    const {id:_omit,...rest}=h; await DB.set(`campaigns/${S.code}/rewards/${id}`,Object.assign(rest,{reverted:true,revertedAt:Date.now()}));
    toast("Recompensa revertida.",true);
  }catch(e){}
}
async function maintSheet(kind){
  const id=$("#mt-sheet").value; const s=S.sheets.find(x=>x.id===id); if(!s)return;
  const p=`campaigns/${S.code}/sheets/${id}`;
  if(kind==="reset"){
    if(!await askConfirm("Resetar XP?",`A experiência disponível de <b>${esc(s.name||"Sem nome")}</b> volta a 0. Atributos, vantagens e progressões ficam como estão.`,"Resetar XP"))return;
    closeModal(); const cur=await DB.get(p); cur.xp=0; cur.updatedAt=Date.now(); await DB.set(p,cur).catch(()=>{}); toast("XP resetado.",true);
  }else{
    if(!await askConfirm("Limpar ficha?",`Tudo em <b>${esc(s.name||"Sem nome")}</b> será apagado e a ficha ficará em branco. Não dá para desfazer.`,"Limpar ficha"))return;
    closeModal(); const b=blankPC(s.owner); b.createdAt=s.createdAt||Date.now(); await DB.set(p,b).catch(()=>{}); toast("Ficha limpa.",true);
  }
}

  }
  const e=wizErr(); const scr=$(".scrim"); const keep=scr?scr.scrollTop:0;
  S.modal="wizard"; lsSet(wizKey(),JSON.stringify(w));
  openModal(`<div class="mh"><h2>Assistente de Criação</h2><button class="icon-btn" data-act="modal-cancel" aria-label="Fechar">${ICON.close}</button></div>

   ${a&&w.step>0?`<p class="label">${esc(a.n)}</p>`:""}${body}</div>
   <div class="mf"><span class="pen small grow" style="align-self:center">${w.touched&&e?esc(e):""}</span>
     ${w.step>0||w.arch?`<button class="btn ghost sm" data-act="wz-reset" title="Apagar rascunho e começar de novo">Recomeçar</button>`:""}
     ${w.step>0?`<button class="btn ghost" data-act="wz-back">Voltar</button>`:""}
     ${w.step<7?`<button class="btn primary" data-act="wz-next">Próximo</button>`:`<button class="btn primary" data-act="wz-finish">Criar personagem</button>`}</div>`,"wide");
  const scr2=$(".scrim"); if(scr2)scr2.scrollTop=keep;
}
function wizCapture(){
  const w=S.wiz; if(!w)return;
  const v=id=>{const e=document.getElementById(id);return e?e.value:null};
  if(w.step===1){if(v("wz-occ")!=null)w.occupation=v("wz-occ");["vestuario","rosto","olhos","corpo"].forEach(k=>{const x=v("wz-look-"+k);if(x!=null)w.look[k]=x})}
  if(w.step===2){document.querySelectorAll("[data-sec]").forEach(t=>w.secretDetails[t.dataset.sec]=t.value)}
  if(w.step===5){[...PASSIVE,...ACTIVE].forEach(k=>{const x=v("wz-at-"+k);if(x!=null)w.attrs[k]=x===""?null:+x})}
  if(w.step===6){if(v("wz-name")!=null)w.name=v("wz-name");w.relations.forEach((r,i)=>{const x=v("wz-rel-"+i);if(x!=null)r.name=x;const y=v("wz-relv-"+i);if(y!=null)r.value=+y});if(v("wz-living")!=null)w.living=v("wz-living");if(v("wz-gear")!=null)w.gear=v("wz-gear")}
}
function autoAttrs(){
  const w=S.wiz; const score={}; [...ACTIVE].forEach(k=>score[k]=0);
  w.adv.forEach(n=>{const at=(ADV[n]||[])[0];if(at&&score[at]!=null)score[at]+=2});
  const order=[...ACTIVE].sort((x,y)=>score[y]-score[x]); POOL_ACTIVE.forEach((v,i)=>w.attrs[order[i]]=v);
  ["vontade","fortitude","reflexos"].forEach((k,i)=>w.attrs[k]=POOL_PASSIVE[i]);
  renderWizard();
}
async function finishWizard(){
  const w=S.wiz, a=ARCH_BY[w.arch];
  const ow=document.getElementById("wz-owner"); const owner=ow?ow.value:(w.owner!=null?w.owner:S.user.key);
  const s=blankPC(owner);
  Object.assign(s,{name:w.name.trim(),archetype:a.n,occupation:w.occupation.trim(),look:w.look,living:w.living,gear:w.gear});
  [...PASSIVE,...ACTIVE].forEach(k=>s.attrs[k]=w.attrs[k]||0);
  s.secrets=w.secrets.map(n=>({name:n,details:w.secretDetails[n]||""}));
  s.disadvantages=[...(a.lock||[]),...w.dis].map(n=>({name:n,notes:""}));
  s.advantages=w.adv.map(n=>({name:n,attr:(ADV[n]||[""])[0],notes:""}));
  s.relations=w.relations.filter(r=>r.name.trim()).map(r=>({name:r.name.trim(),value:r.value,notes:""}));
  if(s.disadvantages.some(d=>d.name==="Arruinado"))s.stability=6;
  try{const id=await createSheet(s); lsSet(wizKey(),null); S.wiz=null; closeModal(); toast("Personagem criado.",true); openSheet("pc",id)}catch(e){}
}

function pickFile(cb){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast("Escolha um arquivo de imagem.");const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};i.click()}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function squareThumb(src,size=360){const im=await loadImg(src);const c=document.createElement("canvas");c.width=c.height=size;const k=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,size,size);return c.toDataURL("image/jpeg",.82)}
let crop=null;
function openCropper(code){
  pickFile(async src=>{
    const im=await loadImg(src).catch(()=>null); if(!im)return toast("Não foi possível abrir essa imagem.");
    crop={code,src,w:im.width,h:im.height,scale:1,min:1,x:0,y:0};
    openModal(`<div class="mh"><h2>Ajustar capa (16:9)</h2><button class="icon-btn" data-act="modal-cancel" aria-label="Fechar">${ICON.close}</button></div>
      <div class="mb"><div class="crop-frame" id="crop-frame"><img id="crop-img" src="${src}" alt="Pré-visualização" draggable="false"></div>
      <label class="field"><span class="label">Zoom</span><input type="range" id="crop-zoom" min="100" max="400" value="100"></label>
      <p class="muted small">Arraste a imagem para enquadrar. Use o controle ou a roda do mouse para aproximar.</p></div>
      <div class="mf"><button class="btn ghost" data-act="modal-cancel">Cancelar</button>${S.coverCache[code]?`<button class="btn danger" data-act="crop-remove">Remover capa</button>`:""}<button class="btn primary" data-act="crop-save">Salvar capa</button></div>`,"wide");
    requestAnimationFrame(()=>{cropFit();cropBind()});
  });
}
function cropFit(){const f=$("#crop-frame");if(!f||!crop)return;const fw=f.clientWidth,fh=f.clientHeight;crop.fw=fw;crop.fh=fh;crop.min=Math.max(fw/crop.w,fh/crop.h);crop.scale=crop.min;crop.x=(fw-crop.w*crop.scale)/2;crop.y=(fh-crop.h*crop.scale)/2;cropApply()}
function cropClamp(){const W=crop.w*crop.scale,H=crop.h*crop.scale;crop.x=Math.min(0,Math.max(crop.fw-W,crop.x));crop.y=Math.min(0,Math.max(crop.fh-H,crop.y))}
function cropApply(){cropClamp();const i=$("#crop-img");if(i)i.style.transform=`translate(${crop.x}px,${crop.y}px) scale(${crop.scale})`}
function cropZoom(newScale,cx,cy){const s0=crop.scale;newScale=Math.max(crop.min,Math.min(crop.min*4,newScale));crop.x=cx-(cx-crop.x)*(newScale/s0);crop.y=cy-(cy-crop.y)*(newScale/s0);crop.scale=newScale;cropApply();const z=$("#crop-zoom");if(z)z.value=Math.round(newScale/crop.min*100)}
function cropBind(){
  const f=$("#crop-frame");if(!f)return;let drag=null;
  f.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,ox:crop.x,oy:crop.y};f.setPointerCapture(e.pointerId);f.classList.add("drag")});
  f.addEventListener("pointermove",e=>{if(!drag)return;crop.x=drag.ox+(e.clientX-drag.x);crop.y=drag.oy+(e.clientY-drag.y);cropApply()});
  const end=()=>{drag=null;f.classList.remove("drag")};f.addEventListener("pointerup",end);f.addEventListener("pointercancel",end);
  f.addEventListener("wheel",e=>{e.preventDefault();const r=f.getBoundingClientRect();cropZoom(crop.scale*(e.deltaY<0?1.08:1/1.08),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  $("#crop-zoom").addEventListener("input",e=>cropZoom(crop.min*(+e.target.value/100),crop.fw/2,crop.fh/2));
}
async function cropSave(){
  const im=await loadImg(crop.src); let W=1280,H=720,q=.82,out="";
  for(let t=0;t<6;t++){const c=document.createElement("canvas");c.width=W;c.height=H;const k=W/crop.fw;const ctx=c.getContext("2d");ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
    ctx.drawImage(im,crop.x*k,crop.y*k,crop.w*crop.scale*k,crop.h*crop.scale*k);out=c.toDataURL("image/jpeg",q);if(out.length<230000)break;q-=.1;if(q<.5){W=Math.round(W*.8);H=Math.round(H*.8);q=.75}}
  const code=crop.code; closeModal();
  try{await DB.set("covers/"+code,{img:out,updatedAt:Date.now(),by:S.user.key});S.coverCache[code]=out;toast("Capa salva.",true);render()}catch(e){}
}

  if(t.id==="bal-expr")S.roller.expr=t.value;
  if(t.id==="rw-def"){S.rew.def=parseInt(t.value,10)||0;document.querySelectorAll('[data-act-input="rw-amt"]').forEach(i=>{if(S.rew.amt[i.dataset.id]==null)i.value=S.rew.def})}
  if(t.id==="rw-reason")S.rew.reason=t.value;
  if(t.id==="gm-notes"){S.gm.notes=t.value;const e=$("#gm-notes-st");if(e)e.textContent="Salvando…";saveGM()}
  if(t.dataset.actInput==="rw-amt")S.rew.amt[t.dataset.id]=t.value;
  if(t.id==="jn-code")t.value=t.value.toUpperCase();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f&&t.closest("#sheetwrap"))return; // tratado no input
  if(t.id==="r-secret")S.roller.secret=t.checked;
  if(/^rw-q\d$/.test(t.id)){const r=S.rew;r.q[+t.id.slice(4)]=t.checked;r.def=r.q.filter(Boolean).length;r.amt={};
    const auto=r.reason===""||/^Fim de sessão/.test(r.reason);if(auto)r.reason=r.def?"Fim de sessão: "+["Verdade","personagens","desafio"].filter((x,i)=>r.q[i]).join(", "):"";render()}
  if(t.id==="mt-sheet")S.maint=t.value;
  if(t.name==="advopt")syncAdvanceUI();
  if(t.dataset.wat){wizCapture();renderWizard()}
  const a=t.dataset.actChange;
  if(a==="assign"){const id=t.dataset.id;const p=`campaigns/${S.code}/sheets/${id}`;DB.get(p).then(cur=>{if(!cur)return;cur.owner=t.value;cur.updatedAt=Date.now();return DB.set(p,cur)}).then(()=>toast(t.value?"Ficha atribuída a "+memberName(t.value):"Ficha sem jogador.",true)).catch(()=>{})}
  if(a==="rw-sel"){S.rew.sel[t.dataset.id]=t.checked;render()}
  if(a==="add-wpn"&&t.value!==""){const w=WEAPON_CAT[+t.value];S.sheetData.weapons.push({name:w.n,attacks:w.a,dist:w.d,ammo:""});touchSheet(true);return}
  if(a==="add-adv"||a==="add-dis"||a==="add-sec"){
    const v=t.value; if(!v)return; const s=S.sheetData;
    const name=v==="__custom"?"":v;
    if(a==="add-adv")s.advantages.push({name,attr:(ADV[name]||[""])[0],notes:""});
    if(a==="add-dis")s.disadvantages.push({name,notes:""});
    if(a==="add-sec")s.secrets.push({name,details:""});
    touchSheet(true);
  }
});

/* ---------------------------- BOOT ---------------------------- */
(async function boot(){
  render();
  await initStore();
  Auth.onChange(u=>{onAuthUser(u).catch(e=>{console.error(e);S.booting=false;render()})});
})();
</script>
</body>
</html>
