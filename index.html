e +0:","o":["Você permanece no controle de sua natureza vingativ e pode agir racionalmente.","Você não consegue se concentrar em nada além do alvo de sua vingança. Sofra –1 constante até o envolvim to do alvo na cena termine.","Você fica obcecado e só consegue agir para promover sua vingança. Fazer qualquer outra coisa exige rolar par Manter o Controle. Sua obsessão não pode ser aliviada enquanto o alvo permanecer na mesma cena com você"]},"Má Reputação":{"t":"Por algum motivo, você atraiu a reprovação do público — ta até antipatia. Talvez você tenha sido notícia nos tabloides co um pedófilo ou assassino, falsamente ou não. Na primeira se de jogo e sempre que atrair a atenção do público, role +0:","o":["Você se mistura. Ninguém tentando te pegar.","Você foi reconhecido. A MJ recebe 1 Reserva.","Várias pessoas te reconheceram. A raiva e o medo contro as ações delas. A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reserva para fazer um Movimento representando como a sua má reputação se agarra a você. Por exemplo, as pessoas podem reagir com medo e desconfiança em relação a você, inchadores podem querer fazer justiça com você, sua propriedade ser vandalizada, seus aliados se voltarem contra você, e você pode perder seu emprego, acordos e relacionamentos."},"Maldição":{"t":"Você é amaldiçoado. Na primeira sessão e sempre que for confrontado pelo sobrenatural, role +0 para ver quão fortemente a maldição influencia você:","o":["Você temporariamente evita os efeitos da maldição.","A MJ recebe 1 Reserva.","A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reserva para fazer um Movimento pela maldição. Por exemplo, você ou alguém de que você gosta sofre um acidente, alguma coisa sua é tirado de você, você experimenta visões aterrorizantes, ou você é forçado a fazer certas ações com risco de terríveis consequências se você se recusar."},"Marcado":{"t":"Você está marcado pela escuridão. A marca pode ter a forma de uma tatuagem de corpo inteiro, uma parte de corpo demoníaca como um braço vestigial, um olho ou boca extra, peças de máquina integradas à sua carne ou manifestações similares. Sempre que você conscientemente causar Dano em alguém, role +0: 3","o":["Você ainda está no controle.","Você alimentou a escuridão. A MJ recebe 1 Reserva.","A escuridão te controla. A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reservas para fazer Movimentos para a escuridão que vive dentro de você. Por exemplo, a escuridão se alimenta de sua energia vital para se sustentar, te obriga a matar para reabastecer a energia vital dela, possui seu corpo e te deixa apenas com fragmentos de memórias do que ocorreu, força você a machucar alguém ao seu redor, ou temporariamente transforma seu corpo o em algo desumano. Você pode precisar Manter o Controle para men- resistir à influência da escuridão."},"Médium Involuntário":{"t":"a Você é um receptáculo aberto a qualquer espírito ou entidade ê. demoníaca que desejar um meio para falar ou precisar de um corpo físico para os seus propósitos. Sempre que encontrar entidades espirituais ou lugares assombrados, role +0:","o":["Você resiste a possessão. alvez omo","A entidade te influencia. A MJ recebe 1 Reserva. essão","A entidade te controla. A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reservas para fazer Movimentos para o ser que possuir você. Por exemplo, a entidade pode te dar uma visão, usar do seu corpo, comunicar-se com ou através de você, tentar prejudicar outra pessoa através de você, te seguir sem ser visto, exigir olam algo de você, ou te arrastar para outra dimensão."},"Memórias Reprimidas":{"t":"Você reprimiu um evento particularmente desagradável do seu passado, mas a lembrança disso às vezes volta à superfície. Isto pode ser um crime ou alguma coisa horrível que você tenha feito, sido submetido ou testemunhado. A MJ decide a natureza da seu memória reprimida, geralmente baseada nos seus Segredos Sombrios. Em situações associadas às suas memórias reprimidas, role +0 para determinar se as memórias ressurgem:","o":["Você continua a suprimir as memórias.","As memórias ressurgem parcialmente, na forma de flashbacks e/ou alucinações. Você deve Manter o Controle.","Você fica sobrepujado por suas memórias reprimidas, se perdendo completamente nelas. A MJ faz um Movimento severo e você reduz −2 de Estabilidade."]},"Mentiroso":{"t":"Você é um mentiroso compulsivo, que inventa estórias em todas as oportunidades, especialmente quando for benéfico para você. No início de cada sessão, role +0 para ver em que problemas suas mentiras te colocaram desta vez:","o":["Você manteve suas mentiras coordenadas.","Você contou mentiras demais. A MJ recebe 1 Reserva.","Sua teia de mentiras foi completamente desvendada. A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reservas sempre que o PJ encontrar alguém que ele conhece e perguntar: “Sobre o que você mentiu para essa pessoa?”, ou para inventar uma mentira problemática que o PJ contou no passado."},"Nêmesis":{"t":"Através de algum ato terrível você fez um inimigo, que faz tudo ao seu alcance para se vingar. Decida quem é seu nêmesis e o que você fez para ele querer vingança. Na primeira sessão de jogo e sempre que você baixar a guarda, role +0 para ver se o seu nêmesis age contra você:","o":["Você está seguro do seu nêmesis por enquanto.","Você foi descuidado e seu inimigo vai age contra você. A MJ recebe 1 Reserva.","Você comprometeu sua posição e seu nêmesis te ataca com força total. A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reserva para fazer Movimentos pelo seu nêmesis. Por exemplo, seu nêmesis pode atacar quando você estiver sozinho, usar segredos que ele descobriu para extorquir você, te intimidar, contratar capangas para te capturar, ou atacar alguém ou alguma coisa que você preza."},"Neurose Sexual":{"t":"Sua sexualidade é uma força controladora e destrutiva em sua vida. Você procura compulsivamente encontros sexuais superficiais e está dispostos a realizar atos degra- dantes — ou até mesmo cometer crimes — para satisfazer suas fantasias. Sempre que você tiver a oportunidade fazer sexo consensual ou tomar vantagem de alguém vulnerável aos seus avanços, role +0:","o":["Você consegue controlar seus desejos. -","Escolha entre fazer sexo com a pessoa ou reduzir −1 de Estabilidade.","Você não pode resistir a fazer sexo com a pessoa e a MJ escolhe uma opção: Você fere ou é ferido pelo seu parceiro sexual (fisicamente ou psicologicamente). Os limites entre dimensões são enfraquecidos; uma entidade do além sente o seu cheiro ou do seu amante. Seu parceiro sexual fica obcecado por você e começa a te perseguir."]},"Obsessão":{"t":"Você descobriu uma conspiração ou fenômeno sobrenatural, e você não pode parar até chegar ao fundo dela. Na primeira sessão de jogo e sempre que você encontrar algo associado com sua obsessão, role +0:","o":["Você supera sua obsessão por um tempo.","Sua obsessão influencia seu comportamento. A MJ recebe 1 Reserva.","Sua obsessão toma o controle total de você. A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reserva para deixar sua obsessão entrar sua vida diária. Você pode ser forçado a escolher entre se envolver com sua obsessão ou perder Estabilidade. Você pode esquecer ocupações importantes e tarefas, faltar reuniões, ou negligenciar suas relações interpessoais para se concentrar exclusivamente em sua obsessão. Sua obsessão pode até influenciar seus sonhos, te dando visões e revelações. Por sua vez, o objeto de sua obsessão também pode perceber você e tente parar suas investigações."},"Pertencido":{"t":"Você costumava ser propriedade pessoal de alguém perigoso, voluntariamente ou não. Desde sua fuga, seu antigo dono tem procurado por você. Decida quem é seu antigo dono. Na primeira sessão do jogo e sempre que você chamar atenção para si mesmo em público, role +0:","o":["Por enquanto você está seguro.","Seu antigo dono encontra seu rastro. A MJ recebe 1 Reserva.","Seu dono te encontra.. A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reserva para fazer Movimentos pelo seu antigo proprietário. Por exemplo, ele aparece inesperadamente para te convencer a voltar, manda capangas atrás de você, sequestra ou prejudica alguém que você gosta, te ameaça diretamente, destrói algo importante seu, tenta te mutilar para que nenhuma outra pessoa queira você, ou te matar imediatamente para ninguém mais possa ter você. do Personagem"},"Pesadelos":{"t":"Você sofre de pesadelos recorrentes, provavelmente conectados aos seus Segredos Sombrios. Durante qualquer cena quando estiver dormindo, role +0:","o":["Você dorme em paz.","Os pesadelos te atormentam. A MJ pode fazer um Movimento pelos seus pesadelos. Por exemplo, você não consegue dormir nada durante a noite (−1 constante até que você durma), algo te segue de volta à realidade, os pesadelos te dão revelações sobre a Verdade, ou você é forçado a processar algum trauma (Manter o Controle) quando você acordar.","Os pesadelos te dominam completamente. Você está preso no sonho até você encontrar uma maneira de acordar, e tudo o que acontece lá também afeta diretamente o seu corpo adormecido."]},"Procurado":{"t":"Você é procurado pelas autoridades — locais, estaduais ou federais — por crimes que você cometeu. Sempre que você atrair atenção para si mesmo ou esquecer de manter a cabeça baixa, role +0 para ver se você foi descoberto:","o":["Você está seguro, por hora.","Você cometeu um erro. A MJ recebe 1 Reserva.","Todos estão te procurando. A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reserva para fazer um Movimento pelas autoridades. Para exemplo, o seu retrato aparece no noticiário da TV e nos jornais, oficiais da lei tentam te apanhar e te prender, ou as autoridades prendem e interrogam alguém importante para você, confiscam seus bens ou deixam seus amigos/familiares contra você."},"Racionalista":{"t":"Você se recusa a acreditar em qualquer coisa não confirmad como fato pela ciência moderna, mesmo estando bem na frente. Além dos efeitos normais, sempre que você Ver Atrav da Ilusão e sempre que a Ilusão se romper, a MJ pode escolha uma opção: Sua presença alimenta a Ilusão, deixando-a mais poder e impenetrável. Sua psique desorientada começa a criar imagens espelh das de lugares e pessoas familiares dentro da Ilusão. Você atrai entidades extradimensionais. Você conscientemente nega o que vê, mesmo que isso prejudique."},"Rival":{"t":"Você tem um rival ambicioso, que fará tudo que puder para ficar no seu lugar. Escolha quem é o rival. Na primeira sessão de jogo e sempre que você cometer um erro ou baixar a guarda, role +0:","o":["Tudo tranquilo; seu rival não faz nenhum movimento contra você.","Você deixa uma brecha para seu rival. A MJ recebe 1 Reserva.","Você entregou ao seu rival o que ele precisava para tentar te destruir. A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reserva para fazer um movimento pelo seu rival. Por exemplo, o rival pode conseguir uma pessoa importante para o lado dele, sabotar um dos seus projetos, te extorquir com evidências que danifiquem sua reputação, ou tomar medidas desesperadas para se livrar permanentemente de você."},"Vício em Drogas":{"t":"Você é viciado em drogas pesadas; cite pelo menos uma. Na primeira sessão do jogo e sempre que estiver usado, ou tiver a oportunidade de usar, role +0:","o":["Você controla a vontade, por enquanto.","A MJ recebe 1 Reserva.","A MJ recebe 3 Reservas."],"x":"A MJ pode gastar Reserva para fazer um Movimento para o seu vício. Por exemplo, você não consegue evitar usar a droga, suas drogas acabam, endivida-se com uma pessoa perigosa, coloca-se em perigo sob a influência das drogas, ou arruina alguma coisa importante para você — como um relacionamento — enquanto está sob a influência. Vítima da Paixão Você tem uma paixão avassaladora por alguém ou alguma coisa, buscando possuí-la a qualquer custo. Na primeira sessão do jogo e sempre que você encontrar o alvo de suas paixões (ou qualquer coisa parecida com isso), role +0:\n(15+) Você mantém sua paixão sob controle. vés\n(14–10) A paixão desperta dentro de você. A MJ recebe 1 Reserva. a\n(–9) Você está completamente nas garras da paixão. A MJ recebe 3 Reservas. rosa A MJ pode gastar Reserva para deixar sua paixão direcionar suas ações. Por exemplo, você anseia incontrolavelmente pelo ha- alvo da sua paixão — você deve encontrá-lo ou reduzir −2 de Estabilidade, o seu desejo arrasta o alvo da sua paixão até os seus sonhos (talvez aprisionando-o lá), sua paixão fica marcada por ciúmes e raiva — fazendo você querer controláte -la e feri-la (deve Manter o Controle para resistir), o seu desejo te deixa confuso frente ao objeto dessa paixão (−1 em todas as rolagens enquanto estão na mesma cena), ou sua paixão pode atrair criaturas da luxúria que querem se alimentar dela ou fazer pactos com você. Vantagens Vantagens são habilidades, características e perícias únicas que os personagens podem ter. Cada personagem recebe três Vantagens da sua lista do arquétipo durante a criação do personagem Conforme o PJ for melhorando através do ganho de Experiência, ele pode adquirir Vantagens adicionais Trunfos Algumas vantagens são especificamente úteis em conflitos e cenas de ação. Em vez de rolar para cada vez que elas são usadas a história, estas vantagens são ativadas apenas uma vez por cena de ação e fornecem ao jogador um ou mais Trunfos, que podem ser gastos para ativar os efeitos da Vantagem. Se outro Movimento for ativado, fornecendo ao jogador Trunfos adicionais, ele perde quaisquer Trunfos ainda não utilizados. Além disso, qualquer Trunfo guardado desaparece no final da cena de ação. Exemplo: Sam entra em uma cena de ação e rola\n(15+) com sua Vantagem Briga de Rua, dando a ele três Trunfos. Ele usa um Trunfo em uma briga com um membro de gangue para ter +2 em Engajar em Combate. Sam joga o cara no chão com uma rápida sucessão de golpes, mas fica rodeado por três amigos do bandido. Sam agora quer ativar a Vantagem Movimentos Ágeis para atacar todos eles simultaneamente. No entanto, ao fazê-lo, ele perderá seus dois Trunfos restantes de Briga de Rua, que serão substituídos por quaisquer novos Trunfos recebidos de Movimentos Ágeis. Como ele não poderá ativar Briga de Rua novamente durante esta cena de ação, ele precisa decidir se vale a pena mudar ou não. Alma"},"Artefato":{"t":"Você possui um item aparentemente mundano que na verdade possui poderes místicos. Seus poderes podem ser ativados através de certos métodos, como derramar sangue nele ou sussurrar palavras proibidas (você decide o que é necessário). Sempre que você ativar o objeto, role +Alma:","o":["Escolha uma opção (a MJ determina o que acontece).","Escolha uma opção (a MJ determina o que acontece). No entanto, o artefato também exige um preço adicional (a MJ determina o que é necessário).","O artefato faz algo inesperado, possivelmente perigoso. A MJ faz um Movimento. Opções Sugeridas: A MJ pode desejar modificar essa lista de opções, seja por conta própria ou trabalhando em conjunto com o jogador para descobrir o que exatamente o artefato do PJ pode fazer. Veja a verdadeira forma de uma criatura ou local. Receba uma visão do que ameaça você. (1 Escape de uma enrascada. Chame a entidade ligada ao artefato e barganhe com ela."]},"Atração Magnética":{"t":"Sempre que você atrair a atenção de todos, role +Alma:","o":["Escolha até três opções. Até duas podem ser guardadas para mais tarde nesta cena.","Escolha uma opção.","Escolha uma opção, mas alguém presente fica obcecae do, te desejando, querendo te prender e possuir para ele mesmo. A MJ faz um Movimento."],"x":"Opções: As pessoas esquecem o que estão fazendo e não podem fazer nada além de olhar para você. Atraia alguém para você. Convença alguém a fazer o que você pedir."},"Aura Carismática":{"t":"Você irradia uma aura que faz as pessoas confiarem em você e procurarem sua companhia. Sempre que sua aura for realmente perceptível, role +Alma:","o":["Escolha duas opções diferentes.","Escolha uma opção.","Escolha uma opção, mas também atraia atenção indesejada. A MJ faz um Movimento."],"x":"Opções: Chame a atenção de um estranho. Ele fica curioso e se aproxima de você. Mude a disposição de uma pessoa em relação a você de agressiva para suspeita, de suspeita para neutra ou de neutra para positiva. Faça seus oponentes perceberem você como inofensivo e ignorá-lo enquanto você permanecer em segundo plano e não agir contra eles."},"Consciência Ampliada":{"t":"Quando você concentra seus sentidos em um local onde a Ilusão é fraca, role +Alma. Com um sucesso, você tem visões sobre o local e pode falar com entidades vinculadas a ele: (15 +) Você pode discernir detalhes claros sobre o local.\n(10–14) Você recebe algumas impressões básicas sobre o local.\n(–9) A Ilusão é rasgada. O véu é levantado temporariamente, revelando uma dimensão alternativa — a MJ determina qual delas. O PJ pode ser sugado ou algo pode passar para a nossa realidade. A MJ faz um Movimento."},"Divino":{"t":"Há algo em você que lembra seus antigos servos do que você ealmente é. Sempre que você encontrar uma criatura monstruosa, role +Alma: 15 +) A criatura confunde você com um deus. Escolha até três opções a qualquer momento durante esta cena. os do Personagem\n(10–14) Você é fascinante para a criatura. Escolha uma opção.\n(–9) Você pode escolher uma opção, mas depois de usá-la a criatura fica determinada a possuir você. Pode tentar lhe devorar ou talvez capturá-lo. A MJ faz um Movimento. Opções: Acalme uma criatura agressiva. Comande a criatura e force-a a obedecer a sua ordem."},"Encantador de Serpentes":{"t":"Sempre que você executar a sua forma de arte escolhida para uma criatura monstruosa inteligente, role +Alma para despertar um desejo dentro dela:","o":["Escolha uma opção imediatamente, e você pode escolher até mais duas a qualquer momento no futuro.","Escolha uma opção.","O desejo está além da capacidade da criatura de compreender. Ela não pode deixar de tentar devorar ou aprisionar você."],"x":"Opções: Peça ajuda à criatura para resolver um problema. Peça à criatura algo que você deseja."},"Enveredamento":{"t":"Sempre que você viajar entre dois locais da cidade e permitir que sua loucura te guie pelas vielas, role +Alma:","o":["Você descobre um atalho pelas vielas que te leva ao seu destino em poucos minutos, independentemente de quão longa a distância realmente seja.","Você descobre um atalho, mas também há algum tipo de obstáculo que você precisará superar.","Você descobre um atalho, mas isso te leva até uma situação perigosa, como o covil de alguma criatura ou uma emboscada de alguma gangue. A MJ faz um Movimento."]},"Exorcista":{"t":"Sempre que você fizer um exorcismo para banir um espírito ou uma criatura extradimensional, explique como é o ritual e role +Alma: (15 +) A criatura é banida. Escolha duas opções.\n(10–14) A criatura é banida. Escolha uma opção.\n(–9) A criatura resiste ao banimento e algo sai terrivelmente errado, como a criatura possuindo você. A MJ faz um Movimento. Opções: Ninguém é prejudicado durante o ritual. A entidade não reaparecerá mais tarde. A entidade não se tornará hostil com você."},"Gênio":{"t":"Sempre que você se encontrar em uma situação de risco de vida, role +Alma para ver se você pode descobrir uma saída:","o":["Receba 3 Trunfos. Você pode usá-los a qualquer momento durante a cena, enquanto você ainda estiver em perigo.","Receba 2 Trunfos. Você pode usá-los a qualquer momento durante a cena, enquanto você ainda estiver em perigo.","Receba 1 Trunfo, mas também atraia atenção indesejada. A MJ faz um Movimento."],"x":"Trunfos: Lógico: Você percebe uma maneira eficaz de eliminar a ameaça. Cause +1 de Dano sempre que você usar isto. Perspicaz: Você percebe como se proteger de Dano. Considere como se tivesse rolado um\n(15+) em Evitar Dano sempre que você usar isto. Racional: Você percebe como se 3 salvar sacrificando outra pessoa. Escolha a pessoa que você utiliza para escapar da ameaça."},"Implantação de Mensagens":{"t":"Sempre que você fizer experiências com um humano, você pode implantar uma ordem neles. Role +Alma:","o":["Você tem 2 de Controle sobre ele.","Você tem 1 de Controle sobre ele. Enquanto você mantiver o Controle sobre ele, ele receberão 1 Ferimento Grave caso se recusem ou tentem ir contra sua ordem, mas isso reduz em 1 seu Controle sobre eles. Se eles cumprirem sua ordem, todo o seu Controle restante será removido.","Algo dá errado, como ele se ferir no processo ou o resultado da ordem for diferente do que você imaginou. A MJ faz um Movimento."]},"Imposição de Mãos":{"t":"Você é capaz de curar os ferimentos dos outros sem usar remédios ou primeiros socorros, mas deve canalizar as lesões para si ou para ntagens 103 outra vítima viva. Para transferir o Ferimento, você deve ser capaz de ver a vítima, mas não necessariamente tocá-la e ela não precisa consentir. O ferimento transferido é do mesmo tipo, gravidade e condição do original. Sempre que você impor as mãos sobre uma pessoa gravemente ou criticamente ferida, e orear, role +Alma:","o":["Você cura completamente a pessoa ferida, canalizando o Ferimento para você ou para um alvo escolhido.","Você estabiliza o ferido, canalizando o Ferimento para você ou para um alvo escolhido.","Você pode escolher estabilizar o ferido, mas se o fizer seus poderes saem do seu controle."]},"Insanidade Contagiante":{"t":"Sempre que você permitir que sua loucura infecte alguém com quem você está falando, role +Alma:","o":["Escolha duas opções.","Escolha uma opção.","Os terrores e Segredos Sombrios de sua pretensa vítima se manifestam dentro de você. Você deve Manter o Controle."],"x":"Opções: Afete sua vítima com uma psicose temporária, na qual ela é assombrada por seus medos (apenas PNJs). Provoque uma Desvantagem em outra pessoa (somente PJs, role para Desvantagem). Afete uma vítima adicional. Chame criaturas da loucura para assombrar os infectados."},"Inspiração Proibida":{"t":"Sempre que você mergulhar profundamente em sua arte e se permitir ser inspirado pela Verdade, role +Alma:","o":["Escolha duas opções.","Escolha uma opção.","Você olhou muito profundamente para o abismo. Escolha uma opção, mas você também experimenta visões terríveis ou encontra algo horrível. A MJ faz um Movimento."],"x":"Opções: Tentação: Atraia uma entidade para vir até você. Visões: Use Ver Através da Ilusão em um local específico de sua escolha. Inspiração: Pergunte para a MJ se há algo estranho ou sobrenatural sobre a situação em que você se encontra. A resposta será revelada através da sua arte."},"Intuição Mágica":{"t":"Você tem uma capacidade inata de perceber as auras de Kirlian e sentir a presença de mágica. Sempre que você utilizar sua intuição mágica, role +Alma:","o":["Escolha até três opções. Até duas podem ser guardadas para mais tarde nesta cena.","Escolha até duas opções. Uma pode ser guardada para mais tarde nesta cena.","Escolha uma opção, mas você também terá uma visão inesperada ou atrairá atenção. A MJ faz um Movimento."],"x":"Opções: Descubra algo sobre a verdadeira natureza de uma criatura. Descubra se algo tem uma natureza mágica. Descubra onde a Ilusão é mais fraca para outras dimensões."},"Líder de Culto":{"t":"Sempre que você e seus seguidores fizerem um ritual, role +Alma:","o":["Escolha receber até três visões da lista abaixo.","Escolha receber até duas visões da lista abaixo.","Escolha uma visão, mas a Ilusão é rasgada como resultado. Você pode ser temporariamente transportado para outra dimensão, atrair a atenção de um ser demoníaco ou receber um presságio horripilante. A MJ faz um Movimento. Visões: A verdadeira forma de uma criatura. Um portal entre dimensões. Os inimigos do culto. O propósito de um objeto. Os desejos de sua divindade (receba +1 em todas as rolagens enquanto tentar atender estes desejos)."]},"Obstinado":{"t":"Sempre que você se esforçar ao máximo para superar uma ameaça, role +Alma:","o":["Receba 3 Trunfos. Você pode usá-los a qualquer momento durante a cena.","Receba 2 Trunfos. Você pode usá-los a qualquer momento durante a cena.","Receba 1 Trunfo, mas você ultrapassou seu limite. Diminua −2 de Estabilidade."],"x":"Trunfos: Desistir jamais: Adiar os efeitos de uma lesão crítica até que você consiga sair do alcance da ameaça. Tente com vontade: Role +Vontade ao invés do atributo normal sempre que você for evitar ou lutar contra o que está te ameaçando. Respire fundo: Liberte-se de um efeito sobrenatural."},"Ocultista Amador":{"t":"Você conhece um pouco de rituais mágicos, mas nunca foi além de executar instruções escritas. Sempre que você tentar realizar um ritual mágico a partir de um conjunto de instruções, role +Alma: do Personagem","o":["Você executa cada passo corretamente; o ritual funciona como pretendido. (1","Você comete um pequeno erro. A MJ escolhe uma complicação: Você não tem proteção funcional contra as forças (1 ou entidades convocadas no ritual. Os efeitos do ritual são ligeiramente diferentes do que você imaginou. ( O ritual invoca entidades ou forças inesperadas.","Você entende mal as instruções e realiza o ritual sem nenhum controle sobre o efeito resultante. A MJ faz um Movimento."]},"Poder Interior":{"t":"Você abriga um poder misterioso que não entende completamente. O poder pode proteger você, mas você não tem controle sobre ele. Sempre que você liberar seu poder interior, role +Alma:","o":["O poder ataca todos os oponentes ao seu arredor, causando 2 de Dano.","O poder ataca seu oponente mais próximo, causando 2 de Dano.","O poder ataca todos os seres vivos nas proximidades, incluindo você, causando 2 de Dano."]},"Sonhador":{"t":"Você é um Andarilho dos Sonhos talentoso e autodidata. Sempre que você quiser conhecer alguém ou descobrir a verdade sobre algo no Sonho, role +Alma: 15+) Você encontra a pessoa pretendida ou chega ao local específico no Sonho. 10–14) Você encontra a pessoa pretendida ou chega ao local específico. No entanto, algum elemento mudou, ou algo seguiu você ou a pessoa em questão.\n(–9) Você se perdeu no Sonho e não pode acordar até encontrar o caminho de volta."},"Vínculo":{"t":"Você está ligado a uma entidade extradimensional cujos poderes você pode usar. Explique o que você acha que é. No início de cada sessão do jogo, role +Alma:","o":["Você pode escolher até três opções a qualquer momento durante a sessão.","Você pode escolher uma opção a qualquer momento durante a sessão.","Você pode escolher uma opção a qualquer momento durante a sessão, mas a MJ faz um Movimento para a entidade em algum momento durante a sessão."],"x":"Opções: Veja a verdadeira forma de uma criatura ou local. Dissipa uma magia cujo alvo é você. Recorrer à entidade."},"Voz da Dor":{"t":"Na primeira vez que você for gravemente ou criticamente ferido pelo ataque de um oponente, você pode receber compressão através da sua dor. Role +Alma:","o":["Você recebe duas opções.","Escolha uma opção.","Escolha uma opção, mas a dor vai sobrecarrega-lo e você desmaiará."],"x":"Opções: Você percebe como passar pelas defesas do seu oponente (receba +1 para Engajar em Combate com ele). Você encontra o ponto fraco do seu oponente (cause +1 de Dano sempre que Engajar em Combate com ele). Você percebe o padrão de ataques do seu oponente (receba +1 para Evitar Dano sempre que ele te atacar). Estes efeitos são permanentes contra este oponente."},"Voz da Insanidade":{"t":"Sempre que você manipular um grupo, role +Alma:","o":["Escolha até três opções a qualquer momento durante esta cena.","Escolha até duas opções a qualquer momento durante esta cena.","Escolha uma opção a qualquer momento durante esta cena. No entanto, o grupo fica incontrolável e volátil, e não poderá ser dispersado. A MJ faz um Movimento."],"x":"Opções: Atraia outras pessoas para se juntarem ao grupo. Os membros do grupo dão todos os seus pertences para você. Una o grupo para lutar por você. Incite o grupo a uma orgia de emoções desenfreadas: luxúria, raiva, tristeza, violência, generosidade ou celebração, dependendo de quais conceitos você está incutindo neles. Carisma"},"Amigos Influentes":{"t":"Você tem amigos com poder e influência. Sempre que você precisar adquirir um objeto, obter acesso a um local restrito ou encontrar uma pessoa específica, role +Carisma:","o":["Seus amigos podem providenciar o que você quiser.","Eles podem providenciar, mas você terá que retribuir o favor mais tarde.","Eles providenciam o que você quer, mas você irrita alguém poderoso ou atrai publicidade negativa. A MJ faz um Movimento."]},"Autoridade":{"t":"Você é uma autoridade acadêmica em seu campo de estudo e seu nome é conhecido em jornais, programas de debates e revistas científicas. No início de cada sessão do jogo, role +Carisma:","o":["Durante esta sessão de jogo, escolha até três opções.","Durante esta sessão de jogo, escolha até duas opções.","Durante esta sessão de jogo, você pode escolher uma opção, mas você também atrai atenção indesejada como fanáticos, adversários da profissão, concorrentes ou forças hostis. A MJ faz um Movimento para eles em algum momento durante a sessão."],"x":"Opções: Use Influenciar Alguém com alguém que tenha ouvido falar de sua autoridade em seu campo acadêmico, como se você tivesse rolado um\n(15+). Obtenha acesso aos recursos de uma universidade, como suas instalações, pesquisadores ou arquivos científicos. Faça uma declaração sobre algo ou alguém em meios de comunicação de massa. Obtenha acesso a pessoas ou lugares sob o pretexto de estar realizando sua pesquisa ou estudos."},"Contatos das Ruas":{"t":"Você tem contatos entre os desabrigados, loucos e outros párias e exilados sociais. Sempre que você quiser saber alguma coisa e verificar com seus contatos, role +Carisma: (15 +) Faça até três perguntas.\n(10–14) Faça uma pergunta.\n(–9) Faça uma pergunta, mas alguém fica desconfiado ou agressivo. A MJ faz um movimento. Perguntas: O que você sabe sobre o [prédio/pessoa/organização/evento]? Que rumores estão circulando pela rua no momento? Como posso conseguir entrar em [localização]? Quem nesta cidade poderia saber mais sobre esta coisa sobrenatural?"},"Educação de Elite":{"t":"Você estudou em um dos institutos de ensino superior de maior prestígio do mundo e fez contatos com poder e influência. Sempre que você pedir um favor aos seus contatos, role +Carisma:","o":["Escolha até três opções.","Escolha até duas opções.","Escolha uma opção, mas você está devendo para alguém. A dívida pode ser cobrada durante a história, quando a MJ escolher."],"x":"Opções: Ganhe um favor da administração de um país (ex.:, seja liberado da cadeia, burle uma verificação da alfândega, ou consiga ajuda da polícia). Obtenha acesso a um local indisponível ao público. Localize ou rastreie uma pessoa escondida ou desaparecida. Receba simultaneamente os meios para fugir e um esconderijo seguro. Traços do Personagem"},"Fascínio":{"t":"duas opç Sempre que você usar sua arte para seduzir um\n(10–14) Esco PNJ, role +Carisma: opções","o":["Escolha uma opção.\n(–9) A leald","Escolha uma opção, mas a MJ tam- é quest bém escolhe uma das seguintes opções: pode Ele fica obcecado por você. faz um Ele quer você agora mesmo.","Ele é afetado por você de uma maneira O inf que você não previu, ou a atração é desconcírcu fortavelmente forte — você escolhe. A MJ faz niza um Movimento. influ"],"x":"Opções: O in Ele fica atraído por você. Ele esquece suas mágoas quando experi- gu menta sua arte. Ele fica totalmente cativado por sua arte e • Lín ignora tudo mais ao redor dele. Semp role +"},"Imponente":{"t":"(15+ Sempre que você demonstrar ser o cara, role +Carisma:","o":["As pessoas ao seu redor te aceitam como líder e ouvem você. Receba +1 constante contra pessoas nesta cena.","As pessoas sentem que você tem potencial para liderança e te mostram respeito. Escolha um deles, especificamente, que concordará com o que você pensa. Você tem +1 constante contra ele (1 durante esta cena.","As pessoas sentem que você é o líder, mas uma delas tenta desafiar sua liderança. A MJ faz um Movimento."]},"Impostor":{"t":"Você mantém relacionamentos com várias pessoas que acreditam que você é a alma gêmea delas, mas não sabem umas das outras. Sempre que você precisar de dinheiro, esconderijo, proteção, ou outro tipo de ajuda que uma de suas vítimas pode fornecer, descreva quem elas são e role +Carisma: (15 +) Elas podem fornecer o que você precisar.\n(10–14) Uma delas pode ajudar, mas será preciso convencê-la.\n(–9) Você conhece alguém que pode ajudar, mas ela já sacou o seu jogo. Se você quiser a ajuda dela, isso vai exigir ameaças ou chantagem para que ela a forneça."},"Infiltrados":{"t":"Você colocou vários infiltrados em grupos ou organizações do seu interesse, como concorrentes de negócios, governos, ou cultos. Sempre que você contatar um dos seus infiltrados para obter informações ou serviços, explique em qual grupo ou orga nização o infiltrado está, nomeie-o, e então role +Carisma: ecebe as ções abaixo. olha uma das abaixo. dade do infiltrado tionável. Você confiar nele? A MJ Movimento. Opções: filtrado adentrou no ulo interno da orgaação; no entanto, sua luência é limitada. infiltrado te deve uma; no ntanto, você precisa atender os pedidos dele para conseuir o que deseja. ngua de Cobra pre que você manipular alguém, +Carisma: +) Escolha uma opção: Ele confia em você (o PJ recebe +1 de Relação com você). Ele fica enfeitiçado por você (receba +1 constante contra ele durante esta cena). Ele revela uma fraqueza, que você pode explorar mais tarde. 10–14) Escolha uma opção da lista acima, mas também há uma complicação, escolhida pela MJ ou jogador: Ele vê você como um amigo para quem pode recorrer quando precisar. Ele se apaixona por você. Ele se sentirá traído, rejeitado, humilhado ou manipulado sempre que você abusar da confiança dele em você.\n(–9) Ele percebe suas intenções e agirá como bem entender."},"Malandragem":{"t":"Sempre que você quiser adquirir itens ou serviços do submundo do crime, role +Carisma:","o":["Sem problema — você consegue o que está querendo. Alguém vai arranjar rapidinho para você.","A MJ escolhe uma opção: Vai te custar um extra, como troca de favores, tarefas ou um preço inflacionado. Você pode conseguir isso, mas apenas se lidar com alguém que você já está devendo. “Merda, eu tinha um, mas eu passei para [inserir nome] — talvez você consiga comprar dela?” “Foi mal, isso é meio fora da minha área, mas quem sabe essa outra coisa possa funcionar?”","Você acha que encontrou o que está procurando, mas haverá condições exorbitantes, falhas consideráveis ou grandes complicações. A MJ faz um Movimento."]},"Notório":{"t":"Você é famoso em seu ofício. Sempre que você encontrar alguém que provavelmente ouviu falar de você, role +Carisma:","o":["Ele conhece a sua reputação; você pode decidir o que ele ouviu. A MJ vai fazer com que ele aja de acordo. Você recebe +2 em sua próxima rolagem usando Influenciar Alguém com ele.","Ele conhece a sua reputação; você pode decidir o que ele ouviu.","Ele conhece a sua reputação; a MJ decide o que ele ouviu."]},"Rede Acadêmica":{"t":"Você tem contatos acadêmicos em universidades de todo o mundo. Quando for útil conhecer alguém em uma universidade, forneça o nome da pessoa, o campo de estudo e como vocês se conheceram, depois role +Carisma:","o":["A pessoa é um amigo (Relação +1).","A pessoa é um conhecido (Relação +0).","Vocês conhecem um ao outro, mas existe uma velha inimizade entre vocês dois (Relação +0)."]},"Rede de Contatos":{"t":"Sempre que você verificar com seus contatos a respeito de um indivíduo de sua escolha, role +Carisma:","o":["Você pode fazer três perguntas da lista abaixo.","Você pode fazer duas perguntas da lista abaixo.","Você pode fazer uma pergunta na lista abaixo, mas a pessoa sobre quem você está perguntando descobre que você está bisbilhotando. A MJ faz um Movimento."],"x":"Perguntas: Que recursos ele têm a sua disposição? Com quem ele negocia? Onde posso encontrá-lo? O que ele quer? O que ele mais teme perder?"},"Sedutor":{"t":"Você pode conscientemente fazer as pessoas se apaixonarem por você. Sempre que você tiver um momento íntimo com alguém, role +Carisma:","o":["Escolha até três opções utilizáveis a qualquer momento da história.","Escolha até duas opções utilizáveis a qualquer momento da história.","Escolha uma opção utilizável a qualquer momento na história, mas você também desenvolve sentimentos pela pessoa. Aumente sua Relação com ela em +1."],"x":"Opções: Dar algo que você quer. Revelar um segredo. Lutar para proteger você. PNJs que se apaixonarem por você não podem se opor a você, contanto que você não tenha usado todas as suas opções. Com PJs, você pode escolher apenas as seguintes opções: Faça ele se sentir mal por se opor a você (ele precisa Manter o Controle) Ele se sente feliz com a sua presença e ganham +2 de Estabilidade."},"Sensualidade":{"t":"Sempre que você fizer ações para deixar um PNJ atraído por você, role +Carisma:","o":["Escolha até três opções a qualquer momento durante esta cena.","Escolha até duas opções a qualquer momento durante essa cena.","Escolha uma opção a qualquer momento durante essa cena, mas a natureza da atração é diferente da que você esperava. A MJ faz um Movimento."],"x":"Opções: A pessoa te deseja, e vai abandonar o comportamento geralmente esperado dela para conseguir isto. A pessoa fica distraída por sua causa enquanto você estiver por perto, ficando incapaz de se concentrar em qualquer outra coisa. A pessoa fica com ciúmes de qualquer um que esteja competindo pela sua atenção, e tentará eliminá-los por quaisquer meios necessários. Você o deixa indeciso e confuso. Você recebe +1 constante contra ele durante esta cena."},"Talento Artístico":{"t":"Sempre que você realizar uma performance da sua forma de arte ou mostrar suas obras para um público, role +Carisma para influenciar seu público a qualquer momento durante a cena:","o":["Escolha até duas opções a qualquer momento durante a cena.","Escolha uma opção a qualquer momento durante a cena. do Personagem","Escolha uma opção, mas uma complicação/ameaça se manifesta. A MJ faz um Movimento."],"x":"Opções: Eles querem ver mais da sua arte. Eles são afetados pela emoção que você queria transm (ex.: raiva, tristeza, medo, alegria, luxúria, etc.). Eles admiram você (receba +1 constante com o público durante esta cena). A atenção deles é focada totalmente em você durante toda a sua performance."},"Vitimista":{"t":"Sempre que você parecer indefeso durante uma situação perigo sa, role +Carisma:","o":["Escolha três opções. Você pode guardar até duas opçõ para usar mais tarde durante a cena.","Escolha uma opção.","Alguém tenta tirar vantagem de você e de sua situação. MJ faz um Movimento."],"x":"Opções: Faça alguém querer cuidar de você. Faça uma pessoa agressiva não querer prejudicá-lo. Faça alguém confiar em você. Firmeza"},"Arrombador":{"t":"Sempre que você usar sua habilidade em arrombamento e invasão, role +Firmeza:","o":["Receba três opções. Você pode usá-las a qualquer momento durante a cena.","Receba duas opções. Você pode usá-las a qualquer momento durante a cena.","Receba uma opção, mas surge um problema. A MJ faz um Movimento."],"x":"Opções: Você abre silenciosamente uma porta trancada em poucos instantes. Você neutraliza um alarme. Você arromba um cofre ou caixa trancada em menos de dois minutos. Você evita ser descoberto por alguém. Faça alguém acreditar que você deveria estar ali (ex.: finja que você é um guarda de segurança), por um tempo limitado."},"Artista da Fuga":{"t":"Você é um mestre em fugir quando a merda bate no ventilador. Sempre que você precisar escapar de uma situação perigosa, descreva o seu plano e role +Firmeza: (15 +) Você foge sem complicações.\n(10–14) Você pode optar por ficar ou escapar com um custo, como deixar algo importante para trás ou levar alguma coisa rastreável com você. A MJ decide o que é.\n(–9) Você está apenas na metade do caminho quando se vê em mitir uma enrascada. A MJ faz um Movimento."},"Ás na Manga":{"t":"Sempre que alguém te botar contra a parede ou te encurralar, role +Firmeza:","o":["Receba 3 Trunfos. Você pode usá-los a qualquer momento durante a cena. o-","Receba 1 Trunfo. Você pode usá-los a qualquer momento durante a cena. ões","Receba 1 Trunfo, mas a situação é pior do que você imaginou. A MJ faz um Movimento."],"x":"Trunfos: Você tem uma pequena arma letal escondida (estilete ou similar), que você pode sacar discretamente. Você percebe que seu oponente tem uma fraqueza que você pode explorar (receba +2 em sua próxima rolagem se ela envolver explorar a fraqueza). Pergunte para a MJ o que ela é. Você vê uma saída. Pergunte para a MJ o que ela é. Receba +2 em sua próxima rolagem para usá-la."},"Ataque Furtivo":{"t":"Sempre que você atacar alguém que não esteja preparado para isso, role +Firmeza:","o":["Escolha duas opções.","Escolha uma opção.","Sua artimanha é exposta e seu alvo consegue reagir ao seu ataque normalmente. A MJ faz um Movimento."],"x":"Opções: Mirar onde dói: Cause +1 de Dano. Nocautear: O PNJ cai inconsciente. Os PJs rolam para Suportar Lesão e ficam neutralizados com um\n(–9). Agir cautelosamente: Você age em silêncio, e se sua vítima morrer você não deixa pistas ou rastros."},"Chefão do Crime":{"t":"Você tem de cinco a dez capangas que são leais a você, geralmente enquanto você continuar os pagando. Sempre que você mandar seus capangas para fazer um trabalho arriscado, role +Firmeza:","o":["Eles seguem as suas ordens e tudo corre conforme o planejado.","Eles seguem suas ordens, mas a MJ escolhe uma opção: Alguém teve problemas. O trabalho não foi concluído e precisa de algo mais para ser terminado. Haverá repercussões mais tarde.","A MJ decide o que deu errado, e se é imediatamente evidente ou se tornará aparente mais tarde. A MJ faz um Movimento."]},"Furtividade":{"t":"Sempre que você ficar escondido e tentar evitar chamar a atenção para si mesmo, role +Firmeza:","o":["Receba 2 opções. Você pode usá-las a qualquer momento durante a cena.","Receba 1 opção. Você pode usá-las a qualquer momento durante a cena.","Receba 1 opção, mas você atrair a atenção de alguém. A MJ faz um Movimento."],"x":"Opções: Encontre um esconderijo seguro por um tempo. Encontre um caminho alternativo para evitar encontrar pessoas. Passe por um sistema de segurança ou outro obstáculo sem ser notado."},"Improvisador":{"t":"Sempre que você tentar sair de uma situação perigosa dando um jeitinho, role +Firmeza:","o":["Escolha duas opções.","Escolha uma opção.","Sua improvisação piora a situação. A MJ faz um Movimento."],"x":"Opções: Invente uma mentira convincente. Encontre algo que você possa usar como uma arma improvisada (2 de Dano cortante/perfurante/contundente). Esconder-se de um perseguidor. Preparar uma armadilha que te dê a vantagem da surpresa (+2 em seu primeiro Movimento de ataque)."},"Mestre das Armas":{"t":"Você é um mestre com armas brancas ou tiroteio. Escolha seu foco: Armas brancas: Role +Firmeza em vez de Violência para Engajar em Combate corpo a corpo, também adicione as seguintes opções par armas corpo a corpo: Ataque de investida [2], [Distância: sala] Ataque de precisão [2], [Distância: braço, ignora armadura Ataque desequilibrante [2], [Distância: braço, alvos caem de bruços] Tiroteio: Role +Firmeza em vez de Violência para Engajar em Combate em um tirote também adicione as seguintes opçõe Dois tiros no peito e um na cabeça [4], [Distância: sala, -2 de munição] Desarmar [1], [Distância: sala, −1 de munição, um PJ alvo deve Agir sob Pressão]"},"Parkour":{"t":"Você é hábil em correr e pular, mesmo em terrenos difíceis. Sempre que você executar manobras acrobáticas, role +Firmeza:","o":["Escolha duas opções. Você pode guardar uma para depois.","Escolha uma opção.","Escolha uma opção, mas surge uma complicação, custo ou nova ameaça. A MJ faz um Movimento."],"x":"Opções: Escale um obstáculo aparentemente impossível. Faça um salto com aparente risco de vida sem sofrer Dano. Evite com sucesso uma ameaça."},"Piloto":{"t":"Você é um profissional treinado na operação de veículos motorizados (carros ou motos). Sempre que você dirigir seu veículo sob pressão e em situações perigosas, role +Firmeza:","o":["Receba 3 Trunfos. Você pode usá-los a qualquer momento durante a cena.","Receba 2 Trunfos. Você pode usá-los a qualquer momento durante a cena.","Receba 1 Trunfo para usar a qualquer momento durante a cena, mas a situação piora de alguma forma — talvez você passe correndo por um carro da polícia, veículos adicionais começam a persegui-lo, ou você ou seu veículo sofre dano. A MJ faz um Movimento."],"x":"Trunfos: Faça uma manobra arriscada para sair do caminho. Livre-se de um veículo perseguidor. Use seu veículo como uma arma contra um pedestre (2/3/4 de Dano dependendo da velocidade). Empurre outro veículo para fora da estrada."},"Sangue Frio":{"t":"Você mantém sua calma e firmeza mesmo em meio da violênra cia e do caos. Sempre que você estiver em um conflito violento, role +Firmeza:","o":["Receba 3 Trunfos. Você pode usá-los a qualquer momento durante a cena.","Receba 2 Trunfos. Você pode usá-los a qualquer momento durante a cena.","Receba 1 Trunfo, mas você atrai a atenção dos inimigos. A a MJ faz um Movimento. eio, do Personagem"],"x":"Trunfos: Evite um ataque. Consiga apanhar alguma coisa. Manobre para uma posição melhor. Coloca alguém em uma situação ruim (todos recebem +2 em quaisquer Movimentos de ataque)."},"Verborragia":{"t":"Sempre que você falar com um PNJ para atrair a atenção dele, role +Firmeza:","o":["Escolha duas opções.","Escolha uma opção.","Escolha uma opção, mas ele fica desconfiado dos seus motivos. A MJ faz um Movimento."],"x":"Opções: Impedir que o PNJ perceba algo nas proximidades. Faça o PNJ revelar algo importante (a MJ fornecerá os detalhes). Distrair o PNJ. Você recebe +1 em sua próxima rolagem contra ele. Intuição"},"Ardiloso":{"t":"Sempre que você manipular um PNJ com uma conversa mais longa, role +Intuição:","o":["Escolha até duas opções. Você pode guardar uma até mais tarde durante esta cena. Se","Escolha uma opção.","Ele está sacando seu jogo. A MJ faz um Movimento."]},"Camaleão":{"t":"Sempre que você imitar a aparência de outra pessoa ou ocultar sua própria identidade para enganar alguém, role +Intuição: (15 +) Seu disfarce é convincente, contanto que você mantenha a atuação em andamento.\n(10–14) Você consegue enganar todos que não te examinam detalhadamente, mas escolha uma complicação: Você não consegue manter esse disfarce por muito tempo. Você deve agir rápido, se não quiser arriscar ser descoberto. Você deixa rastros e pistas para trás, que podem ser conectados a você mais tarde.\n(–9) Seu disfarce só é efetivo à distância. Se você atrair alguma atenção para si mesmo, será desmascarado."},"Comunicação Animal":{"t":"Você é capaz de entender e controlar os animais. Sempre que você tentar controlar um animal, role +Intuição:","o":["Escolha três opções. Você pode guardar até duas para depois.","Escolha duas opções. Você pode guardar uma para depois.","Escolha uma opção, mas o animal é afetado por suas lembranças e Desvantagens. A MJ faz um Movimento."],"x":"Opções: Faça o animal agir contra seus instintos. Faça o animal seguir você. Faça o animal protegê-lo de um atacante."},"Extorsionista":{"t":"empre que você Ler uma Pessoa, você pode escolher entre estas erguntas além das habituais: Do que você tem medo? O que é precioso para você? nterrogador mpre que você Ler uma Pessoa e ela mencionar um nome, pessoa ou to, você sempre poderá perguntar “Você está mentindo?”. Isto não a no número de perguntas que você normalmente pode fazer. tuitivo pode sentir as motivações das pessoas através de leituras nscientes de sua linguagem corporal, escolhas de palavras e ortamento. Sempre que você Ler uma Pessoa, você sempre poderá ma pergunta adicional, além do resultado da rolagem. ervador que você Ler uma Pessoa, você pode escolher entre estas pergundas habituais: tipo de pessoa você é? go estranho sobre você?"},"Personificação":{"t":"Sempre que você tentar se misturar em um lugar ou grupo, adaptando sua aparência e comportamento aos outros presentes, role +Intuição:","o":["Escolha três opções. Você pode guardar até duas para mais tarde.","Escolha duas opções. Você pode guardar uma para mais tarde.","Escolha uma opção, mas as coisas não correm conforme o planejado. A MJ faz um movimento."],"x":"Opções: Aplacar a desconfiança de alguém. Consiga acesso a um local que pessoas de fora não podem ir. Encontre alguém para te contar os segredos deste lugar. Receba ajuda de alguém com alguma coisa aqui. Percepção"},"Acesso à Dark Net":{"t":"Sempre que você pesquisar na Dark Net por informações proibidas, itens raros ou mitos, role +Percepção:","o":["Você descobre o que procura e também pode escolher uma opção: Você descobre um portal para outra dimensão, e um caminho para chegar até ele posteriormente. Você faz contato com alguém — ou alguma coisa — que pode ajudá-lo, pelo preço certo. Você encontra algo valioso ou importante, além do que estava procurando. A MJ lhe dirá o que ele é.","Você encontra o que procura, mas também foi exposto a estímulos repulsivos e assustadores. Você deve Manter o Controle para ver como isso te afeta.","Você encontra o que procura, mas também entra em contato com algo muito perigoso. Isto pode tentar se prender em você ou segui-lo de volta para a realidade. A MJ faz um Movimento."]},"Andarilho":{"t":"Sempre que você estiver indo para uma comunidade ou outra parte da cidade, role +Percepção:","o":["Você já esteve aqui antes. Escolha duas opções a qualquer momento durante a sua visita.","Você já ouviu falar desse lugar. Escolha uma opção a qualquer momento durante a sua visita.","Você já esteve aqui antes, mas algo de ruim aconteceu. Escolha uma opção a qualquer momento durante a visita. A MJ explica que tipo de problem espera por você aqui e faz um Movimento."],"x":"Opções: Faça uma pergunta para a MJ sobre esse lugar. Você tem um contato neste lugar que, com um pouco de convencimento, poderia ajudá-lo. Você tem um esconderijo aqui, onde você pode abaixar a guarda e descansar um pouco. Você sabe algo sobre esse lugar. Diga aos outros o que é."},"Caçador":{"t":"Sempre que você estiver caçando alguém ou alguma coisa, role +Percepção:","o":["Receba três opções. Você pode usá-las a qualquer momento durante esta cena.","Receba duas opções. Você pode usá-las a qualquer momento durante esta cena.","Receba uma opção, mas você se torna a presa. A MJ faz um Movimento."],"x":"Opções: Arme uma emboscada para seu inimigo (cause o Dano da sua arma). Camufle-se (receba +2 para Agir sob Pressão enquanto estiver se escondendo). Movimente-se nas sombras (receba +2 para Evitar Dano causado por uma arma de longo alcance)."},"Consciência Corporal":{"t":"Seu corpo e mente são como um. Sempre que você executar proezas acrobáticas ou ágeis, role +Percepção:","o":["Escolha uma opção.","Escolha uma opção, mas você se expõe ao perigo ou deve pagar um preço.","Escolha uma opção, mas algo dá muito errado. A MJ faz um Movimento."],"x":"Opções: Escape de amarras ou outras contenções. Ultrapasse um obstáculo (criatura ou objeto). Entre ou atravesse um espaço que você normalmente não conseguiria passar."},"Destemido":{"t":"Sempre que você entrar em uma situação perigosa, role +Percepção:","o":["Receba 3 Trunfos. Você pode usá-los a qualquer momento durante a cena.","Receba 2 Trunfos. Você pode usá-los a qualquer momento durante a cena.","Receba 1 Trunfo, mas isso é demais para você. A MJ faz um Movimento."],"x":"Trunfos: Mantenha os olhos abertos: Descubra uma ameaça antes que ela descubra você. Saia do caminho: Evite um ataque. Saia na frente: Cause Dano em seu oponente antes que ele possa reagir. aços do Personagem"},"Instinto":{"t":"Sempre que você Observar uma Situação e agir de acordo com as respostas da MJ, receba +2 em vez de +1."},"Olhar Minucioso":{"t":"Sempre que você tiver uma oportunidade para estudar alguém por um tempo, role +Percepção:","o":["Faça três perguntas da lista abaixo.","Faça duas perguntas da lista abaixo.","Faça uma pergunta da lista abaixo, mas você expõe sua curiosidade para a pessoa que você está observando. A MJ faz um Movimento."],"x":"Perguntas: De onde você é? Você é capaz de violência? Como posso seduzir ou instigar você? Por que você está aqui? No que você está trabalhando?"},"Olho Clínico":{"t":"Sempre que você Observar uma Situação, você pode escolher entre estas perguntas além das habituais: Que fraquezas eles possuem que eu posso usar como vantagem? Que forças eles possuem que eu devo tomar cuidado?"},"Saída Estratégica":{"t":"Sempre que você matar alguém secretamente e sair da cena do crime, role +Percepção:","o":["Você recebe todas as três opções abaixo.","Escolha duas das opções abaixo.","Escolha uma opção, mas você corre o risco de ser des coberto ou de enfrentar obstáculos inesperados. A MJ um Movimento."],"x":"Opções: Você deixa a cena do crime sem ser notado e alcança um cal seguro de sua escolha nas proximidades. Descreva co Você não deixou pistas que possam levar até você. O corpo está bem escondido e não será encontrado algum tempo."},"Sombra":{"t":"Ao seguir alguém, role +Percepção:","o":["Você evita ser descoberto, segue seu alvo até o destino final e aprende algo sobre ele que pode ser usado a seu favor mais tarde.","Você evita ser descoberto e segue seu alvo até o destino final.","Você é visto ou encontra algum tipo de problema ao longo do caminho. A MJ faz um Movimento. Por outro lado, sempre que você quiser despistar alguém que esteja seguindo você, role +Percepção:\n(15+) Você despista seus perseguidores e pode escolher tentar segui-los.\n(10–14) Você despista seus perseguidores.\n(–9) Seus perseguidores ainda estão no seu encalço e eles podem montar uma emboscada, desaparecer sem deixar vestígios (apenas para aparecer quando você menos esperar), ou se recusar a ir embora. A MJ faz um Movimento."]},"Sondagem de Grupo":{"t":"Sempre que você passar por um grupo para coletar informações, role +Percepção. Exemplos de “grupo” incluem uma festa, bar/restaurante ou um escritório. Você decide quais informações você está procurando, desde que faça sentido para o grupo possua tais informações:","o":["Faça três perguntas.","Faça duas perguntas, mas você também atrai atenção indesejada para você.","Faça uma pergunta, mas você expôs seu disfarce. Aqueles que têm o que você procura estarão esperando por você. A MJ faz um Movimento."],"x":"Perguntas: Quem aqui tem informações que eu quero? Onde posso encontrar o que estou procurando? Quem está me observando? Há mais alguma coisa interessante?"},"Técnicas de Sobrevivência":{"t":"Sempre que você utilizar suas técnicas de sobrevivência, role +Percepção:","o":["Escolha até três opções utilizáveis enquanto você permanecer nesta situação.","Escolha até duas opções utilizáveis enquanto você permanecer nesta situação. loomo.","Escolha uma opção utilizável enquanto você permanecer nesta situação, mas você também ignorou algo importante. A MJ faz um Movimento."],"x":"Opções: Encontrar água e alguma coisa comestível. Atravessar um obstáculo ambiental. Encontrar um local seguro para se esconder e descansar. Razão"},"Analista":{"t":"Sempre que você Investigar algo, você pode escolher entre estas perguntas além das habituais: Quais organizações, grupos ou pessoas de interesse podem estar conectados com isto? Existe uma conexão entre este e outro evento? O que seria um motivo plausível?"},"Astuto":{"t":"Sempre que você começar uma missão perigosa, role +Razão:","o":["Escolha até três opções a qualquer momento durante a missão.","Escolha até duas opções a qualquer momento durante a missão.","A qualquer momento durante a missão, escolha uma opção, mas você não levou em conta alguma coisa. A MJ faz um Movimento."],"x":"Opções: Lembre-se de algo que é vantajoso em uma negociação. Pergunte para a MJ o que é isso. Você possui algum equipamento que pode usar para sair de uma situação complicada. Pergunte para a MJ o que é. Você tem treinamento em algum campo específico que seria útil para superar um dos seus obstáculos. Pergunte para a MJ o que é isso."},"Biblioteca de Ocultismo":{"t":"Sempre que você estiver na sua biblioteca pesquisando o sobrenatural, role +Razão:","o":["Faça a MJ duas perguntas da lista abaixo.","Faça a MJ uma pergunta da lista abaixo.","Faça a MJ uma pergunta da lista abaixo, mas você não percebeu ou ignorou algo crucial. A MJ recebe 1 Reserva que pode ser usada a qualquer momento para fazer um Movimento suave ou severo."],"x":"Perguntas: Com qual poder superior isso tem conexões? O que eu preciso ter, ou preciso fazer, para exorcizar ou controlar este ser? Com qual dimensão isso está associado? O que eu devo fazer para me proteger disso?"},"Cientista":{"t":"Sempre que você Investigar um objeto ou entidade usando os equipamentos apropriados, você pode escolher entre estas perguntas além daquelas conseguidas pela investigação: Perguntas: Que propriedades isso tem? (receba +1 em quaisquer rolagens contra entidades ou objetos semelhantes na próxima vez que você encontrá-los). Como eu posso utilizar isso? (receba +1 em quaisquer rolagens associada com o uso do objeto). Qual é o seu propósito?"},"Colecionador":{"t":"Sempre que você procurar um item incomum ou raro, role +Razão:","o":["Você sabe exatamente onde o item está, como adquiri-lo e como minimizar riscos, obstáculos e/ou custos.","Você sabe mais ou menos onde ele está e que perigos, obstáculos, e/ou custos estão associados à sua aquisição.","Você sabe mais ou menos onde começar a procurar, mas não os riscos ou custos envolvidos na sua busca."]},"Coleta de Dados":{"t":"Sempre que você procurar informações sobre um assunto em uma biblioteca, em um arquivo de pesquisas, ou na Internet, role +Razão. Em resposta às suas pesquisas, a MJ dirá o que você descobriu com o detalhamento esperado da fonte que você utilizou:","o":["Faça três perguntas.","Faça duas perguntas.","Faça uma pergunta, mas você também descobre algo inesperado. A MJ faz um Movimento."],"x":"Perguntas: Qual é a origem disso? Com o que eu tenho que tomar cuidado? Qual o propósito disso? Como posso parar ou Como isso funciona? destruir isso?"},"Especialista":{"t":"Você é um especialista em certos campos do conhecimento. Sempre que você Investigar algo associado com uma das áreas escolhidas, você poderá fazer uma pergunta adicional, além do resultado, e poderá formular as perguntas que quiser: Escolha duas áreas de especialização: Arqueologia Psicologia Economia Sociologia História Teologia Literatura comparada (Outra) aços do Personagem"},"Estudos de Ocultismo":{"t":"Você é um estudante do oculto. Ao entrar em contato com uma disciplina mágica, entidade ou fenômeno pela primeira vez, role +Razão:","o":["Receba as duas opções abaixo.","Escolha uma opção.","Você tem uma memória nebulosa de alguma coisa assim, mas não consegue ter certeza se é verdade ou não. A MJ explica o que é que você lembra."],"x":"Opções: Eu sei algo sobre isso (pergunte para a MJ o que você sabe, e receba +1 constante enquanto agir baseado nestas respostas durante essa cena). Eu sei onde posso encontrar mais informações sobre isso (pergunte para a MJ onde)."},"Hacker":{"t":"Sempre que você invadir redes digitais na busca de dados confidenciais, crackear programas ou desabilitar sistemas de segurança, role +Razão:","o":["Você realiza sua tarefa sem nenhum problema.","Surgem complicações. Escolha uma opção: Alguém descobre a invasão. Você deve assumir riscos ou comprometer o quanto você pode realizar. Você deixa vestígios da sua invasão.","Sem você notar, sua invasão não transcorreu como você queria. Talvez você não tenha tido tanto sucesso em sua tarefa quanto imaginou, ou pode ter sido descoberto por inimigos pessoais, por forças da lei ou por outra coisa espreitando na rede. A MJ faz um Movimento."]},"Inventor":{"t":"Sempre que você for começar a criar ou consertar alguma coisa, explique o que você está querendo fazer. A MJ dirá o que você vai precisar para ter sucesso, e uma vez que você tenha coletado estes materiais, você pode role +Razão:","o":["A invenção tem sucesso e você pode escolher duas opções abaixo.","A invenção tem pequenas falhas. Você pode escolher uma opção abaixo.","Você completa a invenção ou reparo, mas ela tem falhas significativas, algumas destas não aparentes. A MJ faz um Movimento."],"x":"Opções: Durável: A invenção o pode ser usada várias vezes e não quebra facilmente. Efetiva: A invenção confere +1 em rolagens na qual for usada para a finalidade pretendida. Letal: A invenção causa +1 de Dano. Protetora: A invenção confere +1 de armadura."},"Investigador Forense":{"t":"Sempre que você investigar uma cena de crime, role +Razão e faça perguntas na lista abaixo:","o":["Faça duas perguntas.","Faça uma pergunta.","Faça uma pergunta, mas sua investigação o coloca em perigo ou apresentará problemas adicionais mais tarde."],"x":"Perguntas: Qual foi a sequência de eventos? O que posso assumir sobre o autor? Que erros o autor cometeu? Quando o crime foi cometido? Quando foi a última vez que alguém esteve aqui? O crime me lembra de algo que já conheço, e em caso afirmativo o quê? Quem poderia saber mais sobre o crime?"},"Paramédico":{"t":"Sempre que você for estabilizar os ferimentos de uma pessoa ferida, mesmo que não tenha acesso a equipamentos médicos, role +Razão:","o":["Escolha duas opções.","Você pode escolher uma opção. No entanto, você também deve escolher uma complicação: 3 Você deixa cicatrizes ou defeitos cosméticos (o paciente perde −2 de Estabilidade). Há efeitos colaterais remanescentes (−1 em todas as rolagens que o ferimento poderia influenciar até que ele esteja totalmente curado). O paciente fica nocauteado até que a MJ determine que ele acorda.","Você estabiliza a ferida, mesmo sem ter acesso a equipamentos médicos, mas também há consequências inesperadas e potencialmente perigosas, como infecções, deformidades na recuperação ou outros efeitos colaterais graves. A MJ faz um Movimento."],"x":"Opções: Improviso: Você estabiliza um Ferimento sem ter acesso a equipamentos médicos. Efetivo: Você estabiliza dois Ferimentos em vez de um. Cuidadoso: O ferimento é estabilizado e será curado muito mais rápido que o normal. antagens 115"},"Perito em Explosivos":{"t":"Você pode construir e desarmar bombas. Se você tiver tempo e recursos suficientes, poderá construir qualquer tipo de bomba que desejar. No entanto, sempre que você estiver construindo uma bomba improvisada sob a pressão do prazo, role +Razão:","o":["Você constrói uma bomba funcional (veja Explosivos no Capítulo 4 – O Personagem Jogador).","O potencial de explosão da bomba é menor que o normal (diminua o Dano causado em –1).","A bomba é imprevisível. Pode não detonar, detonar prematuramente, ou ser mais poderosa e volátil do que o esperado. A MJ faz um Movimento. Quando você desarmar uma bomba, role +Razão:\n(15+) A bomba foi desativada.\n(10–14) Surgem complicações. Talvez você não consiga desativá-la completamente, apenas adiar o cronômetro, enfraquecer o efeito explosivo, ou algo mais aparece e piora as coisas.\n(–9) Fudeu, deu ruim! A bomba pode explodir em suas mãos, o temporizador começa a contar 10, 9, 8, 7…, ou problemas ainda maiores ocorrem. A MJ faz um Movimento."]},"Precavido":{"t":"Sempre que você investigar um local antes de visitá-lo, role +Razão:","o":["Escolha três opções.","Escolha duas opções.","Escolha uma opção, mas você não percebeu ou ignorou algo crucial. A MJ recebe 1 Reserva, que pode ser usada a qualquer momento para fazer um Movimento suave ou severo para o local."],"x":"Opções: Encontre ou crie um mapa do local. Descubra quaisquer sistemas de segurança assim como outros obstáculos. Ache a localização precisa de algo que você procura."},"Rastreador":{"t":"Sempre que você estiver procurando informações sobre alguém, role +Razão:","o":["Faça a MJ três perguntas da lista abaixo.","Faça a MJ duas perguntas da lista abaixo.","Faça a MJ uma pergunta da lista abaixo, mas alguém descobre que você esteve bisbilhotando."],"x":"Perguntas:  com que ele congele e seja incapaz de agir até que você interrompa o contato visual. Você também recebe +2 constante contra seu alvo.","Você faz contato visual com um PNJ, fazendo com que ele congele e seja incapaz de agir até que você interrompa o contato visual.","Seus oponentes veem você como a principal ameaça a eles."]},"Perito em Artes Marciais":{"t":"Sempre que você estiver lutando em corpo a corpo, role +Violência:","o":["Receba 2 Trunfos. Você pode usá-los a qualquer momento durante a cena.","Receba 1 Trunfo.","Receba 1 Trunfo, mas você subestima seus oponentes, que podem ser mais numerosos ou habilidosos do que você assumiu primeiramente. A MJ faz um Movimento. ços do Personagem"],"x":"Trunfos: Bloqueio: Evite um ataque corpo-a-corpo. Ataque giratório: Engajar em Combate contra vários oponentes ao seu redor, como um ataque único. Desarme: Remova a arma de um oponente. Arremesso: Reposicione um oponente ou derrube-o ao chão."},"Sniper":{"t":"Sempre que você atirar em um alvo distante utilizando um rifle com luneta, role +Violência:","o":["O tiro atinge seu alvo. Escolha duas opções.","O tiro atinge seu alvo. Escolha uma opção.","O tiro não atingiu você pretendia, ou você revela sua posição para o inimigo — espere testemunhas, oponentes te perseguindo conforme você deixar a cena, ou outros problemas. A MJ faz um Movimento."],"x":"Opções: Cause +1 de Dano. Atinja também outro alvo. Imobilize seu alvo. Faça o alvo perder o controle de alguma coisa. Você não revela a sua posição. Nenhum Atributo Associado"},"Ambicioso":{"t":"Sempre que você realmente desejar alguma coisa, você pode receber +2 em uma rolagem diminuindo −2 de Estabilidade."},"Bom Samaritano":{"t":"Sempre que você ajudar alguém às suas próprias custas, ganhe +1 de Estabilidade."},"Código de Honra":{"t":"Você obedece a um rigoroso código de honra. Decida a natureza dele. Sempre que você se arriscar ou fizer sacrifícios pelo seu código de honra, ganhe +1 de Estabilidade."},"Desesperado":{"t":"Sempre que você tentar avançar frente grandes desafios, receba +1 em todas as rolagens até que você esteja longe da ameaça."},"Destino Selado":{"t":"Sempre que você receber um Ferimento Crítico, você pode marcar 1 de Tempo de Condenado para estabilizar imediatamente o Ferimento. Sempre que você morrer, marque 2 de Tempo de Condenado e desperte, ferido e fraco, mas vivo. Todos os seus Ferimentos estarão estabilizados."},"Durão":{"t":"Você recebe +1 constante para Suportar Lesão."},"Esportista de Elite":{"t":"Você competiu profissionalmente em um esporte, e por isto recebia uma bolsa para financiar seus estudos. Escolha um esporte: Esgrima: Ao usar espadas, você pode fazer o ataque, Ripostar [3], [Distância: braço, ataque imediatamente após aparar], e você tem um florete [Arma perfurante] em casa. Beisebol/Críquete/Rúgbi/Futebol/Tênis: Você recebe +1 constante para correr, arremessar ou apanhar objetos. Hóquei no gelo: Você recebe +1 em rolagens para Suportar Lesão contra ataques em combate corpo a corpo."},"Fúria":{"t":"Quando estiver em combate, você pode despertar sua fúria interior. Perca −1 de Estabilidade e marque 1 de Fúria. Cada vez que você receber um ferimento e cada vez que você derrotar um inimigo, aumente +1 de Fúria. A Fúria dura até o fim do combate. Durante o combate, você pode gastar 1 de Fúria para escolher 1 Trunfo: Ataque brutal: Receba +1 de Dano no seu ataque. Ignorando a dor: Receba +2 para Suportar Lesão. Perdido no frenesi: Desconsidere e ignore influências psicológicas ou sobrenaturais."},"Guerreiro Divino":{"t":"Sempre que você enfrentar os inimigos da sua divindade ou lutar para proteger um objeto sagrado, você causa +1 de Dano e recebe +1 para Suportar Lesão. Se você perder uma batalha destas, sua divindade ficará irada, e você recebe –1 constante em todas as ações relacionadas à sua divindade até você pagar por seu fracasso."},"Inabalável":{"t":"Você não é tão facilmente afetado pelo trauma quanto os outros. Sempre que você reduzir Estabilidade, você sempre perde 1 nível a menos do que o normal."},"Indiferença":{"t":"Sempre que você rolar\n(10–14) para Manter o Controle, você pode suprimir suas emoções e adiar seus efeitos até a próxima cena."},"Indomável":{"t":"Você está familiarizado com abuso, violência, autoflagelação e agressões, e a dor mal te afeta hoje em dia. Você não sofre penalidades por ferimentos, sejam graves ou críticos. antagens 119"},"Manipulador":{"t":"Sempre que você fizer um favor para alguém ou aprende um dos segredos dele, mais tarde você pode escolher uma das opções abaixo, lembrando-o dos seus favores anteriores ou mencionando o segredo que você conhece: Receba +2 para Influenciar Alguém com ele. Receba +2 para Atrapalhar ele."},"Olho por Olho":{"t":"Sempre que sofrer uma lesão grave ou crítica, nomeie a pessoa que você pensa ser responsável. Você recebe +2 constante em todas as rolagens contra ela, para sempre. Válido para todas as rolagens visando esta pessoa, mas rolagens visando família, amigos, servos, e propriedade da pessoa só valem se a MJ achar que é aplicável."},"Oportunista":{"t":"Sempre que você sacrificar alguém para avançar nos seus próprios objetivos, ganhe +1 de Estabilidade."},"Pesquisador Arcano":{"t":"Sempre que você se aventurar em planos alternativos de existência ou encontra entidades de outras dimensões, você pode declarar que já leu sobre esta dimensão ou criatura. Pergunte para a MJ o que você aprendeu com seus estudos anteriores."},"Rancor":{"t":"Quando alguém, direta ou indiretamente, estraga seus planos, você recebe +1 constante contra ele até ter se vingado ou receber restituição de equivalente ao que você perdeu."},"Sacrifício Pessoal":{"t":"gem Condenado) Quando você se recusar a desistir mesmo que as chances estejam contra você, marque 1 de Tempo e role novamente os dados."},"Sede de Conhecimento":{"t":"Sempre que você aprender novas informações sobre planos de existência alternativos, uma entidade sobrenatural, ou um Poder Superior, ganhe +1 de Estabilidade."},"Tiro Certeiro":{"t":"Você é um atirador experiente. Quaisquer Danos que você causa com uma arma de fogo são considerados tendo +1 de Dano."},"Viajado":{"t":"Sempre que você chegar num local novo do mundo mundano, decida se você esteve aqui antes, e em caso afirmativo, cite alguns detalhes significativos para você sobre o lugar. Além disso, decida se você conheceu alguém lá e o que você deixou para trás. A MJ dirá o que mudou desde então."},"Vigias":{"t":"Você está sendo observado e protegido por um grupo de pessoas misteriosas, que querem te manter vivo para os propósitos obscuros deles. Sempre que você estiver em perigo mortal, você pode ativar seus vigias. Se você fizer isto, a MJ recebe 1 Reserva. Os vigias agem como uma gangue pequena/ média/grande (2/3/3 de Dano, 5/10/15 Ferimentos), dependendo de quão poderosa for a ameaça. A única motivação deles é mantê-lo fora de perigo. A MJ também pode gastar Reserva em nome dos vigias para deixá-los fazer um Movimento contra você."},"Workaholic":{"t":"Sempre que você criar algo ou executar um experimento, ganhe +1 de Estabilidade. Traços do Personagem"},"Atento":{"t":"compo Sempre que você Ler uma Pessoa, você fazer um pode escolher entre estas perguntas além das habituais: Obse Você está escondendo alguma coisa • de mim? Sempre O que você realmente sente por mim? tas além Que ti Há alg"},"Sexto Sentido":{"t":"Você tem uma intuição para as coisas, boas e más. No início de cada sessão do jogo, role +Alma:","o":["Escolha até três opções a qualquer momento durante a sessão.","Escolha até duas opções a qualquer momento durante a sessão.","Seus instintos não serão acionados em uma situação perigosa. A MJ faz um Movimento em algum momento durante a sessão."],"x":"Opções: Aja primeiro em uma situação ameaçadora. Isso pode incluir até mesmo agir antes de um ataque surpresa. Sinta se alguém deseja o bem ou o mal para você. Descubra ou sinta uma pista ou indicação quando estiver perdido."},"Interrogador":{"t":"Sempre que você Ler uma Pessoa e ela mencionar um nome, pessoa ou objeto, você sempre poderá perguntar “Você está mentindo?”. Isto não conta no número de perguntas que você normalmente pode fazer."},"Intuitivo":{"t":"Você pode sentir as motivações das pessoas através de leituras subconscientes de sua linguagem corporal, escolhas de palavras e comportamento. Sempre que você Ler uma Pessoa, você sempre poderá fazer uma pergunta adicional, além do resultado da rolagem."},"Observador":{"t":"Sempre que você Ler uma Pessoa, você pode escolher entre estas perguntas além das habituais: Que tipo de pessoa você é? Há algo estranho sobre você?"},"Língua de Cobra":{"t":"Sempre que você manipular alguém, role +Carisma:","o":["Escolha uma opção: Ele confia em você (o PJ recebe +1 de Relação com você). Ele fica enfeitiçado por você (receba +1 constante contra ele durante esta cena). Ele revela uma fraqueza, que você pode explorar mais tarde.","Escolha uma opção da lista acima, mas também há uma complicação, escolhida pela MJ ou jogador: Ele vê você como um amigo para quem pode recorrer quando precisar. Ele se apaixona por você. Ele se sentirá traído, rejeitado, humilhado ou manipulado sempre que você abusar da confiança dele em você.","Ele percebe suas intenções e agirá como bem entender."]},"Vítima da Paixão":{"t":"Você tem uma paixão avassaladora por alguém ou alguma coisa, buscando possuí-la a qualquer custo. Na primeira sessão do jogo e sempre que você encontrar o alvo de suas paixões (ou qualquer coisa parecida com isso), role +0: da","o":["Você mantém sua paixão sob controle. sua vés","A paixão desperta dentro de você. A MJ recebe 1 Reserva. a","Você está completamente nas garras da paixão. A MJ recebe 3 Reservas. rosa"],"x":"A MJ pode gastar Reserva para deixar sua paixão direcionar suas ações. Por exemplo, você anseia incontrolavelmente pelo ha- alvo da sua paixão — você deve encontrá-lo ou reduzir −2 de Estabilidade, o seu desejo arrasta o alvo da sua paixão até os seus sonhos (talvez aprisionando-o lá), sua paixão fica marcada por ciúmes e raiva — fazendo você querer controláte -la e feri-la (deve Manter o Controle para resistir), o seu desejo te deixa confuso frente ao objeto dessa paixão (−1 em todas as rolagens enquanto estão na mesma cena), ou sua paixão pode atrair criaturas da luxúria que querem se alimentar dela ou fazer pactos com você. Desvantagens 101 Vantagens Vantagens são habilidades, características e perícias únicas que os personagens podem ter. Cada personagem recebe três Vantagens da sua lista do arquétipo durante a criação do personagem Conforme o PJ for melhorando através do ganho de Experiência, ele pode adquirir Vantagens adicionais Trunfos Algumas vantagens são especificamente úteis em conflitos e cenas de ação. Em vez de rolar para cada vez que elas são usadas a história, estas vantagens são ativadas apenas uma vez por cena de ação e fornecem ao jogador um ou mais Trunfos, que podem ser gastos para ativar os efeitos da Vantagem. Se outro Movimento for ativado, fornecendo ao jogador Trunfos adicionais, ele perde quaisquer Trunfos ainda não utilizados. Além disso, qualquer Trunfo guardado desaparece no final da cena de ação. Exemplo: Sam entra em uma cena de ação e rola\n(15+) com sua Vantagem Briga de Rua, dando a ele três Trunfos. Ele usa um Trunfo em uma briga com um membro de gangue para ter +2 em Engajar em Combate. Sam joga o cara no chão com uma rápida sucessão de golpes, mas fica rodeado por três amigos do bandido. Sam agora quer ativar a Vantagem Movimentos Ágeis para atacar todos eles simultaneamente. No entanto, ao fazê-lo, ele perderá seus dois Trunfos restantes de Briga de Rua, que serão substituídos por quaisquer novos Trunfos recebidos de Movimentos Ágeis. Como ele não poderá ativar Briga de Rua novamente durante esta cena de ação, ele precisa decidir se vale a pena mudar ou não. Alma Artefato"}};

function rnd(n){const a=new Uint32Array(1);(window.crypto||{getRandomValues:x=>{x[0]=Math.random()*4294967296;return x}}).getRandomValues(a);return 1+(a[0]%n)}
function fmtTime(ts){const d=new Date(ts);const now=new Date();const t=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});return d.toDateString()===now.toDateString()?t:d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+t}

async function sha256(s){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}return "f"+(h1>>>0).toString(16)+(h2>>>0).toString(16)}
}

/* ---------------------------- Armazenamento ---------------------------- */
function LocalDB(){
  const KEY="itm_localdb_v1"; let mem={};
  try{mem=JSON.parse(lsGet(KEY)||"{}")||{}}catch(e){mem={}}
  const subs=new Set();
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){toast("Armazenamento local cheio. Remova imagens grandes.")}};
  const snap=(p)=>{const d=mem[p];return {id:p.split("/").pop(),exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  const notify=()=>setTimeout(()=>subs.forEach(s=>{try{s.fire()}catch(e){console.error(e)}}),0);
  window.addEventListener("storage",e=>{if(e.key===KEY){try{mem=JSON.parse(e.newValue||"{}")}catch(x){}notify()}});
  function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object")merge(a[k],b[k]);else a[k]=b[k]}return a}
  function docRef(p){return {id:p.split("/").pop(),path:p,
    get:async()=>snap(p),
    set:async(d)=>{mem[p]=clone(d);persist();notify()},
    update:async(d)=>{if(!mem[p])throw {code:"invalid_argument",message:"documento inexistente"};mem[p]=merge(mem[p],clone(d));persist();notify()},
    delete:async()=>{delete mem[p];persist();notify()},
    acquire:async()=>({acquired:true}),
    onSnapshot(next){const s={fire:()=>next(snap(p))};subs.add(s);setTimeout(s.fire,0);return ()=>subs.delete(s)},
    collection:(c)=>colRef(p+"/"+c)}}
  function query(cp,f=[],ord=null,lim=null){
    const run=()=>{const depth=cp.split("/").length+1;let docs=Object.keys(mem).filter(k=>k.startsWith(cp+"/")&&k.split("/").length===depth).map(snap);
      for(const [fl,op,v] of f){docs=docs.filter(d=>{const x=d.data()[fl];return op==="=="?x===v:op==="!="?x!==v:op===">"?x>v:op==="<"?x<v:op===">="?x>=v:op==="<="?x<=v:op==="in"?v.includes(x):op==="array-contains"?(Array.isArray(x)&&x.includes(v)):true})}
      if(ord){const [fl,dir]=ord;docs.sort((a,b)=>{const x=a.data()[fl],y=b.data()[fl];if(x===y)return 0;if(x==null)return 1;if(y==null)return -1;return (x<y?-1:1)*(dir==="desc"?-1:1)})}else docs.sort((a,b)=>a.id<b.id?-1:1);
      if(lim)docs=docs.slice(0,lim);
      return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
    return {where:(a,b,c)=>query(cp,[...f,[a,b,c]],ord,lim),orderBy:(a,b)=>query(cp,f,[a,b||"asc"],lim),limit:n=>query(cp,f,ord,n),
      get:async()=>run(),onSnapshot(next){const s={fire:()=>next(run())};subs.add(s);setTimeout(s.fire,0);return ()=>subs.delete(s)}}}
  function colRef(p){return Object.assign(query(p),{path:p,doc:(id)=>docRef(p+"/"+(id||uid())),add:async(d)=>{const r=docRef(p+"/"+uid());await r.set(d);return r}})}
  return {doc:docRef,collection:colRef};
}
