<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kult: Divindade Perdida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,500;0,700;1,400&family=Special+Elite&display=swap">
<style>
/* Layout: a candle-lit crypt — black stone panels, bone-white type, blood as the single accent. Single committed dark look. */
:root{
  color-scheme: dark;
  --void:#0a0808;         /* page */
  --crypt:#141011;        /* panels */
  --crypt-2:#1d1617;      /* raised */
  --crypt-3:#271d1f;      /* inputs */
  --scar:#45282b;         /* borders */
  --scar-2:#6a3a3e;
  --bone:#ede3d0;         /* text */
  --ash:#b9ab95;          /* muted text */
  --ash-2:#8c806f;
  --blood:#c41e3a;        /* accent */
  --blood-hi:#e8475d;
  --blood-deep:#5c0d1a;
  --gold:#d8bf72;         /* sucesso completo */
  --rust:#d98b3d;         /* sucesso com complicações */
  --fail:#e8475d;         /* falha */
  --f-display:"IM Fell English SC","IM Fell English",Georgia,"Times New Roman",serif;
  --f-italic:"IM Fell English",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-type:"Special Elite","Courier New",Courier,monospace;
  --r:6px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:var(--void);
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(196,30,58,.14), transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 110%, rgba(92,13,26,.25), transparent 70%);
  background-attachment:fixed;
  color:var(--bone);
  font-family:var(--f-body);
  font-size:18px;
  line-height:1.55;
  margin:0;
}
::selection{background:var(--blood);color:var(--bone)}
a{color:var(--blood-hi)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}
h2{font-size:1.9rem}
h3{font-size:1.45rem}
h4{font-size:1.15rem}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 120px}
.muted{color:var(--ash)}
.small{font-size:.88rem}
.type{font-family:var(--f-type)}
.label{font-family:var(--f-type);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
hr.rule{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--scar-2),transparent);margin:8px 0}

/* buttons */
.btn{font:inherit;font-family:var(--f-display);font-size:1.08rem;letter-spacing:.04em;cursor:pointer;border-radius:var(--r);
  border:1px solid var(--scar-2);background:var(--crypt-2);color:var(--bone);padding:10px 18px;min-height:46px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--blood-hi);background:var(--crypt-3)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.inp:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#b01a33,#7d1124);border-color:var(--blood-hi);color:#fff6ea}
.btn.primary:hover{background:linear-gradient(180deg,#c92341,#8f1429)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--blood);color:var(--blood-hi);background:transparent}
.btn.danger:hover{background:rgba(196,30,58,.12)}
.btn.sm{font-size:.95rem;padding:6px 12px;min-height:38px}
.btn.xs{font-size:.85rem;padding:3px 9px;min-height:32px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{background:none;border:1px solid transparent;color:var(--ash);cursor:pointer;border-radius:var(--r);padding:4px 8px;font:inherit;min-height:36px}
.icon-btn:hover{color:var(--bone);border-color:var(--scar)}
.roll-btn{font-family:var(--f-type);font-size:.85rem;letter-spacing:.06em;cursor:pointer;border:1px solid var(--blood);background:rgba(196,30,58,.12);color:var(--bone);border-radius:999px;padding:4px 12px;min-height:34px;white-space:nowrap}
.roll-btn:hover{background:var(--blood);color:#fff}

/* inputs */
.inp,select,textarea{font:inherit;font-size:1rem;color:var(--bone);background:var(--crypt-3);border:1px solid var(--scar);border-radius:var(--r);padding:9px 12px;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.5}
select{cursor:pointer}
.inp::placeholder,textarea::placeholder{color:var(--ash-2)}
.inp:focus,select:focus,textarea:focus{border-color:var(--blood-hi);outline:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.inp.big{font-family:var(--f-display);font-size:1.6rem;padding:6px 12px}
.inp.code{font-family:var(--f-type);letter-spacing:.3em;text-transform:uppercase;font-size:1.4rem;text-align:center}
.num{width:76px;text-align:center;font-family:var(--f-type)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--blood);cursor:pointer}

/* surfaces */
.panel{background:linear-gradient(180deg,var(--crypt-2),var(--crypt));border:1px solid var(--scar);border-radius:10px;padding:20px;min-width:0}
.panel>h3{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sig{color:var(--blood-hi);font-size:1.1rem;margin-right:10px}
.sigil{font-family:var(--f-display);color:var(--blood-hi)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--scar-2);border-radius:999px;padding:3px 12px;font-size:.92rem;background:var(--crypt-3);color:var(--bone);cursor:default}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:var(--blood-hi)}
.chip.on{background:var(--blood-deep);border-color:var(--blood-hi)}
.chip.lock{border-style:dashed}
.badge{font-family:var(--f-type);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:4px;border:1px solid var(--scar-2);color:var(--ash)}
.badge.master{border-color:var(--gold);color:var(--gold)}
.badge.player{border-color:var(--ash-2)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--scar);flex-wrap:wrap}
.tab{font-family:var(--f-display);font-size:1.15rem;background:none;border:0;border-bottom:3px solid transparent;color:var(--ash);padding:10px 16px;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--bone)}
.tab.on{color:var(--bone);border-bottom-color:var(--blood)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px}
.login-card{width:100%;max-width:470px;display:flex;flex-direction:column;gap:22px}
.brand{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.brand h1{font-size:clamp(3.4rem,12vw,5.4rem);letter-spacing:.18em;padding-left:.18em;color:var(--bone);text-shadow:0 0 24px rgba(196,30,58,.45)}
.brand .sub{font-family:var(--f-display);color:var(--blood-hi);font-size:1.5rem;letter-spacing:.12em;margin-top:-6px}
.brand .mark{width:68px;height:68px}
.quote{font-family:var(--f-italic);font-style:italic;color:var(--ash);text-align:center;font-size:1.02rem;max-width:40ch;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,8,8,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--scar)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--void)}
.topbar .in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.topbar .logo{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.06em;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:var(--bone);padding:0}
.topbar .logo svg{width:30px;height:30px}
.topbar .who{margin-left:auto;display:flex;gap:10px;align-items:center}

/* home */
.hero-home{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:18px 0 26px}
.camp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}
.camp-card{background:var(--crypt);border:1px solid var(--scar);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.camp-card .cover{aspect-ratio:16/9;max-width:100%;background:var(--crypt-3);position:relative;overflow:hidden}
.camp-card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.camp-card .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.camp-card h3{font-size:1.5rem}
.cover-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--scar-2);background:
  repeating-linear-gradient(135deg,rgba(69,40,43,.22) 0 2px,transparent 2px 14px),var(--crypt-3)}
.cover-empty svg{width:70px;height:70px;opacity:.7}
.empty{border:1px dashed var(--scar-2);border-radius:10px;padding:34px;text-align:center;color:var(--ash);display:flex;flex-direction:column;gap:12px;align-items:center}

/* campaign */
.camp-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:18px 0 6px}
.camp-head h1{font-size:clamp(2rem,5vw,3.2rem)}
.mgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;margin-top:22px;align-items:start}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:980px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.code-box{font-family:var(--f-type);font-size:2.4rem;letter-spacing:.32em;color:var(--gold);background:var(--crypt-3);border:1px dashed var(--gold);border-radius:8px;padding:10px 6px 10px 18px;text-align:center;user-select:all;word-break:break-all}
.cover-frame{aspect-ratio:16/9;max-width:100%;width:100%;border-radius:8px;overflow:hidden;position:relative;border:1px solid var(--scar);background:var(--crypt-3)}
.cover-frame img{width:100%;height:100%;object-fit:cover;display:block}
.player-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;margin-top:22px;align-items:stretch}
@media (max-width:860px){.player-hero{grid-template-columns:1fr}}

.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--crypt-3);border:1px solid var(--scar);border-radius:8px;padding:10px 12px}
.li .nm{font-family:var(--f-display);font-size:1.25rem}
.li .meta{color:var(--ash);font-size:.9rem}
.avatar{width:52px;height:52px;border-radius:6px;object-fit:cover;background:var(--crypt-2);border:1px solid var(--scar-2);flex:none;display:grid;place-items:center;color:var(--scar-2);font-family:var(--f-display);font-size:1.4rem;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pc-card{background:var(--crypt-2);border:1px solid var(--scar);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.pc-card:hover{border-color:var(--blood-hi)}
.pc-card .top{display:flex;gap:12px;align-items:center}
.pc-card .avatar{width:64px;height:64px}

/* dice roller */
.roller{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.roller .field{width:90px}
.dpreset{display:flex;gap:6px;flex-wrap:wrap}

/* XP pips */
.pips{display:inline-flex;gap:5px;align-items:center}
.pip{width:16px;height:16px;border:1.5px solid var(--gold);transform:rotate(45deg);display:inline-block}
.pip.on{background:var(--gold)}

/* rewards */
.rew-row{display:grid;grid-template-columns:28px minmax(0,1fr) 90px;gap:10px;align-items:center;padding:6px 8px;border-radius:6px}
.rew-row:hover{background:var(--crypt-3)}
.hist{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding-right:4px}
.hist .h{border-left:3px solid var(--gold);padding:6px 10px;background:var(--crypt-3);border-radius:0 6px 6px 0}
.hist .h.rev{border-left-color:var(--ash-2);opacity:.6}
.hist .h.rev .what{text-decoration:line-through}

/* balloon */
#balloon{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:55}
.bal-min{width:74px;height:74px;border-radius:12px;background:linear-gradient(180deg,#a3172f,#5c0d1a);border:1px solid var(--blood-hi);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 4px rgba(196,30,58,.15);position:relative}
.bal-min svg{width:38px;height:38px}
.bal-min .cnt{position:absolute;top:-8px;right:-8px;background:var(--gold);color:#1a1000;font-family:var(--f-type);font-size:.85rem;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 6px}
.bal-min::after{content:"";position:absolute;bottom:-9px;right:16px;width:16px;height:16px;background:#5c0d1a;border-right:1px solid var(--blood-hi);border-bottom:1px solid var(--blood-hi);transform:rotate(45deg)}
.bal-open{width:min(390px,calc(100vw - 32px));height:min(560px,calc(100vh - 120px));background:var(--crypt);border:1px solid var(--blood);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden}
.bal-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--scar);background:var(--crypt-2)}
.bal-head h4{flex:1}
.bal-list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.bal-foot{border-top:1px solid var(--scar);padding:10px;display:flex;gap:8px;background:var(--crypt-2)}
.rl{background:var(--crypt-2);border:1px solid var(--scar);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.rl.new{animation:flash 1.2s ease}
@keyframes flash{0%{background:rgba(196,30,58,.4)}100%{background:var(--crypt-2)}}
.rl .t1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rl .who{font-family:var(--f-display);font-size:1.05rem}
.rl .when{font-family:var(--f-type);font-size:.75rem;color:var(--ash-2)}
.rl .what{color:var(--ash);font-size:.92rem}
.rl .res{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rl .tot{font-family:var(--f-type);font-size:1.6rem;line-height:1}
.rl .dice{font-family:var(--f-type);font-size:.85rem;color:var(--ash)}
.tier-full{color:var(--gold)}.tier-partial{color:var(--rust)}.tier-fail{color:var(--fail)}
.tier-tag{font-family:var(--f-type);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 7px}
.secret-tag{font-family:var(--f-type);font-size:.72rem;color:var(--ash-2);border:1px dashed var(--ash-2);border-radius:4px;padding:0 6px}

/* modal & overlays */
.scrim{position:fixed;inset:0;background:rgba(5,3,3,.82);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 28px) 40px}
.modal{width:100%;max-width:640px;background:var(--crypt);border:1px solid var(--scar-2);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.7);display:flex;flex-direction:column}
.modal.wide{max-width:1000px}
.modal .mh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--scar)}
.modal .mh h2{flex:1;font-size:1.7rem}
.modal .mb{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--scar);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* result */
#result{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(5,3,3,.7);padding:16px;cursor:pointer}
.res-card{background:radial-gradient(ellipse at top,var(--crypt-2),var(--crypt));border:1px solid var(--blood);border-radius:14px;padding:26px 28px;max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 90px rgba(0,0,0,.8)}
.res-card .lab{font-family:var(--f-display);font-size:1.6rem}
.res-card .tot{font-family:var(--f-type);font-size:4.6rem;line-height:1}
.res-card .tiername{font-family:var(--f-display);font-size:1.7rem}
.res-card .out{font-family:var(--f-italic);font-style:italic;font-size:1.12rem;color:var(--bone)}
.dierow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.die{width:58px;height:62px;position:relative;display:grid;place-items:center;font-family:var(--f-type);font-size:1.35rem;color:var(--bone)}
.die svg{position:absolute;inset:0;width:100%;height:100%}
.die span{position:relative}
.die.tumble{animation:tumble .55s cubic-bezier(.2,.8,.3,1)}
@keyframes tumble{0%{transform:rotate(-200deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.die.tumble,.rl.new{animation:none}}

/* toasts */
#toasts{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 120px))}
.toast{background:var(--crypt-2);border:1px solid var(--scar-2);border-left:4px solid var(--blood);border-radius:6px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.toast.ok{border-left-color:var(--gold)}
.banner{background:rgba(217,139,61,.12);border:1px solid var(--rust);color:var(--bone);border-radius:8px;padding:10px 14px;font-size:.95rem}

/* sheet */
#sheetwrap{position:fixed;inset:0;z-index:50;background:var(--void);overflow:auto}
.sheet-bar{position:sticky;top:0;z-index:5;background:rgba(10,8,8,.95);border-bottom:1px solid var(--scar);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar .in{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sheet{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px;display:flex;flex-direction:column;gap:20px}
.sh-head{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:20px;align-items:start}
@media (max-width:760px){.sh-head{grid-template-columns:96px minmax(0,1fr)}.sh-head .xpbox{grid-column:1/-1}}
.portrait{width:100%;aspect-ratio:1;border-radius:8px;border:1px solid var(--scar-2);background:var(--crypt-3);overflow:hidden;position:relative;cursor:pointer;display:grid;place-items:center;color:var(--ash-2);font-size:.85rem;text-align:center;padding:0}
.portrait img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.sh-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:1100px){.sh-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.sh-cols{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.attr{background:var(--crypt-3);border:1px solid var(--scar);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.attr .an{font-family:var(--f-display);font-size:1.15rem}
.attr .av{display:flex;align-items:center;gap:6px}
.attr .av .val{font-family:var(--f-type);font-size:1.8rem;min-width:52px}
.step{width:32px;height:32px;border-radius:50%;border:1px solid var(--scar-2);background:var(--crypt-2);color:var(--bone);cursor:pointer;font-size:1.1rem;line-height:1}
